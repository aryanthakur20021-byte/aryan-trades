<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Aryan Trades</title>
<meta name="theme-color" content="#2d1e14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aryan Trades">
<style>
  :root{
    --paper:#fdf8f0;
    --paper-2:#f4ebdb;
    --cream:#f8efe0;
    --cream-2:#efe1c8;
    --ink:#2b2016;
    --ink-soft:#5c4c3a;
    --ink-faint:#8d7b64;
    --brand:#2d1e14;
    --brand-2:#1f140d;
    --brand-3:#4a3122;
    --gold:#e8a33d;
    --gold-light:#f5c878;
    --accent:#c4531f;
    --accent-dark:#933c14;
    --good:#3d7a4a;
    --bad:#b3402a;
    --line:rgba(43,32,22,0.12);
    --shadow:0 14px 34px -16px rgba(43,32,22,0.3);
    --shadow-lg:0 24px 60px -20px rgba(31,20,13,0.5);
    --ease:cubic-bezier(.16,.84,.44,1);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--brand-2);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;font-weight:600;letter-spacing:-0.01em;color:var(--ink);}
  .num{font-variant-numeric:tabular-nums;}

  .app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;}

  .topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:var(--cream);padding-top:calc(var(--safe-top) + 14px);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 14px;gap:10px;}
  .brand-row{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:Georgia,serif;font-weight:700;color:var(--brand-2);font-size:13px;}
  .topbar h1{font-size:20px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .sync-dot{width:9px;height:9px;border-radius:50%;background:rgba(248,239,224,.3);}
  .sync-dot.on{background:#6fcf87;box-shadow:0 0 0 3px rgba(111,207,135,.2);}
  .date-chip{position:relative;display:flex;align-items:center;gap:6px;background:rgba(248,239,224,0.12);color:var(--cream);padding:8px 12px;border-radius:100px;font-weight:700;font-size:13px;border:1px solid rgba(248,239,224,0.2);}
  .date-chip svg{width:13px;height:13px;opacity:.85;}
  .date-chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}

  .view{flex:1;padding:16px 16px calc(120px + var(--safe-bottom));overflow-x:hidden;width:100%;}
  .section-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .section-title:first-child{margin-top:2px;}
  .section-title button{font-size:12px;letter-spacing:0;text-transform:none;color:var(--accent-dark);font-weight:700;}

  .date-nav{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:14px;}
  .date-nav button{width:38px;height:34px;border-radius:10px;background:var(--cream-2);font-size:19px;font-weight:700;color:var(--ink-soft);}
  .date-nav .dn-label{font-weight:800;font-size:14px;text-align:center;}
  .date-nav .dn-sub{display:block;font-size:11px;font-weight:700;color:var(--accent-dark);}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--accent-dark);margin-bottom:12px;}

  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi-card{background:var(--brand);color:var(--cream);border-radius:18px;padding:14px 15px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .kpi-card::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.05);}
  .kpi-card.gold{background:linear-gradient(155deg,var(--gold) 0%,#cf8520 100%);color:var(--brand-2);}
  .kpi-card.accent{background:linear-gradient(155deg,var(--accent) 0%,var(--accent-dark) 100%);color:var(--paper);}
  .kpi-card.light{background:var(--cream);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .kpi-card.wide{grid-column:1 / -1;}
  .kpi-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;}
  .kpi-value{font-family:Georgia,"Iowan Old Style",Palatino,serif;font-size:23px;font-weight:600;margin-top:5px;line-height:1.1;}
  .kpi-sub{font-size:11.5px;opacity:.75;margin-top:4px;}

  .card{background:var(--cream);border-radius:16px;padding:12px 15px;border:1px solid var(--line);}
  .card + .card{margin-top:10px;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:transform .18s var(--ease),background .18s var(--ease);}
  .row:active{transform:scale(.98);background:var(--cream-2);}
  button.row,label.row{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;}
  .row-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .row-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12.5px;color:var(--ink-soft);}
  .row-end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
  .row-amt{font-weight:800;font-size:15px;}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:100px;text-transform:uppercase;white-space:nowrap;}
  .badge.good{background:rgba(61,122,74,.14);color:var(--good);}
  .badge.warn{background:rgba(232,163,61,.2);color:#8a5a12;}
  .badge.bad{background:rgba(179,64,42,.14);color:var(--bad);}
  .badge.plain{background:rgba(92,76,58,.12);color:var(--ink-soft);}
  .date-heading{font-size:12px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 8px;}
  .empty{text-align:center;padding:34px 20px;color:var(--ink-faint);}
  .empty h3{font-size:15px;margin-bottom:4px;color:var(--ink-soft);}
  .empty p{font-size:13px;}

  .ms{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .ms:last-child{border-bottom:none;}
  .ms b{font-weight:800;text-align:right;}
  .ms small{display:block;font-size:11px;color:var(--ink-faint);font-weight:600;}
  .ms.total{border-top:2px solid var(--ink);border-bottom:none;margin-top:2px;padding-top:10px;font-size:14.5px;}
  .ms.total span{font-weight:800;}
  .ms .good{color:var(--good);} .ms .bad{color:var(--bad);}
  .link{font-size:12px;font-weight:700;color:var(--brand);background:var(--gold-light);padding:5px 10px;border-radius:100px;flex-shrink:0;}

  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .act{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);transition:transform .15s var(--ease);}
  .act:active{transform:scale(.95);background:var(--cream-2);}
  .act .ic{width:30px;height:30px;border-radius:10px;background:var(--brand);color:var(--gold-light);display:flex;align-items:center;justify-content:center;}
  .act .ic svg{width:17px;height:17px;}

  .rate-card{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-3) 100%);color:var(--cream);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .rate-card .rv{font-family:Georgia,serif;font-size:24px;font-weight:600;}
  .pill-btn{font-size:12.5px;font-weight:700;color:var(--brand-2);background:var(--gold);padding:8px 14px;border-radius:100px;flex-shrink:0;}

  .jeep-card{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-bottom:12px;}
  .jeep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .jeep-head h3{font-size:17px;}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
  .stat3 div{background:var(--paper);border-radius:10px;padding:7px 8px;border:1px solid var(--line);min-width:0;}
  .stat3 span{display:block;font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .stat3 b{font-size:14px;font-weight:800;}
  .jeep-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
  .jeep-btns button{background:var(--brand);color:var(--cream);border-radius:10px;padding:9px 2px;font-size:12px;font-weight:700;}
  .jeep-btns button.alt{background:var(--cream-2);color:var(--ink);}
  .sub-list{margin-top:8px;border-top:1px dashed var(--line);}
  .sub-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
  .sub-row:last-child{border-bottom:none;}
  .sub-row:active{background:var(--cream-2);}
  .sub-row .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sub-row .l small{color:var(--ink-faint);font-weight:600;}
  .sub-row .r{display:flex;align-items:center;gap:6px;flex-shrink:0;font-weight:700;}
  .calc-line{background:var(--cream-2);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:13px;display:flex;justify-content:space-between;gap:10px;}
  .calc-line b{font-weight:800;}

  .search{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);margin-bottom:10px;outline:none;}
  .search:focus{border-color:var(--brand);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{padding:8px 13px;border-radius:100px;background:var(--cream-2);font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .chip.active{background:var(--brand);color:var(--cream);}

  .att{display:flex;gap:4px;flex-shrink:0;}
  .att button{width:34px;height:32px;border-radius:9px;background:var(--cream-2);font-weight:800;font-size:12.5px;color:var(--ink-faint);}
  .att button.on.P{background:var(--good);color:#fff;}
  .att button.on.H{background:var(--gold);color:var(--brand-2);}
  .att button.on.A{background:var(--bad);color:#fff;}
  .att button.dflt.P{box-shadow:inset 0 0 0 1.5px var(--good);color:var(--good);}

  .hub{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hub button{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s var(--ease);}
  .hub button:active{transform:scale(.97);}
  .hub .ic{width:34px;height:34px;border-radius:11px;background:var(--brand);color:var(--gold-light);display:flex;align-items:center;justify-content:center;}
  .hub .ic svg{width:18px;height:18px;}
  .hub b{font-size:14px;}
  .hub small{font-size:11.5px;color:var(--ink-faint);font-weight:600;line-height:1.3;}

  .tbl-wrap{overflow-x:auto;background:var(--cream);border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch;}
  .tbl{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap;}
  .tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;}
  .tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--cream);z-index:1;}
  .tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;}
  .tbl tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;}
  .tbl td.bad{color:var(--bad);font-weight:700;} .tbl td.good{color:var(--good);font-weight:700;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:700;font-size:14.5px;width:100%;transition:transform .2s var(--ease);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--brand);color:var(--cream);box-shadow:0 12px 26px -12px rgba(45,30,20,.55);}
  .btn-ghost{background:var(--cream-2);color:var(--ink);}
  .btn-danger{background:rgba(179,64,42,.1);color:var(--bad);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  .btn:disabled{opacity:.6;}

  .fab{position:fixed;z-index:45;right:calc((100vw - min(480px,100vw))/2 + 18px);bottom:calc(88px + var(--safe-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 32px -10px rgba(196,83,31,.6);transition:transform .25s var(--ease),opacity .25s var(--ease);}
  .fab:active{transform:scale(.92);}
  .fab svg{width:24px;height:24px;}
  .fab.hidden{opacity:0;pointer-events:none;transform:scale(.6);}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:44;max-width:480px;margin:0 auto;background:rgba(253,248,240,0.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:7px 2px calc(7px + var(--safe-bottom));}
  .side-brand{display:none;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink-faint);border-radius:12px;min-width:0;}
  .tab svg{width:21px;height:21px;flex-shrink:0;}
  .tab span{font-size:10px;font-weight:700;}
  .tab.active{color:var(--accent-dark);}

  .sheet-overlay{position:fixed;inset:0;background:rgba(24,16,10,0.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);}
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:480px;margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.4);padding:10px 20px calc(24px + var(--safe-bottom));max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .38s var(--ease);}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;border-radius:100px;background:var(--line);margin:6px auto 14px;}
  .sheet h2{font-size:19px;margin-bottom:14px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--brand);}
  .field input[readonly]{opacity:.8;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;min-width:0;}
  .segmented{display:flex;background:var(--cream);border-radius:12px;padding:4px;border:1.5px solid var(--line);}
  .segmented button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--ink-soft);}
  .segmented button.active{background:var(--brand);color:var(--cream);}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--brand-2);color:var(--cream);padding:11px 20px;border-radius:100px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);transition:opacity .25s var(--ease),transform .25s var(--ease);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .banner{background:rgba(232,163,61,.15);border:1px solid rgba(232,163,61,.4);color:#744a0e;border-radius:14px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;}
  .banner b{display:block;font-size:13px;margin-bottom:2px;}

  /* ---------- laptop / desktop ---------- */
  @media (min-width: 960px){
    body{background:var(--paper-2);}
    .app{max-width:none;margin:0;padding-left:236px;box-shadow:none;background:var(--paper-2);}
    .topbar{background:var(--paper-2);color:var(--ink);padding-top:18px;border-bottom:1px solid var(--line);}
    .topbar-inner{max-width:1140px;margin:0 auto;padding:4px 32px 16px;}
    .topbar h1{color:var(--ink);font-size:26px;}
    .topbar .brand-mark{display:none;}
    .date-chip{background:var(--brand);color:var(--cream);border:none;padding:10px 16px;}
    .sync-dot{background:rgba(43,32,22,.2);}
    .view{max-width:1140px;margin:0 auto;padding:24px 32px 60px;}
    .tabbar{top:0;bottom:0;left:0;right:auto;width:236px;max-width:none;margin:0;flex-direction:column;justify-content:flex-start;gap:4px;padding:22px 14px;border-top:none;background:var(--brand);backdrop-filter:none;-webkit-backdrop-filter:none;}
    .side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 26px;color:var(--cream);}
    .side-brand .brand-mark{width:36px;height:36px;font-size:15px;}
    .side-brand b{font-family:Georgia,serif;font-size:19px;font-weight:600;}
    .side-brand small{display:block;font-size:11px;opacity:.6;font-weight:600;}
    .tab{flex:none;flex-direction:row;gap:12px;padding:12px 14px;color:rgba(248,239,224,.62);}
    .tab span{font-size:14px;}
    .tab:hover{background:rgba(248,239,224,.06);}
    .tab.active{background:rgba(248,239,224,.12);color:var(--gold-light);}
    .kpi-grid{grid-template-columns:repeat(4,1fr);}
    .actions{grid-template-columns:repeat(6,1fr);}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
    .cols .section-title:first-child{margin-top:22px;}
    .jeep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
    .jeep-grid .jeep-card{margin:0;}
    .list.grid2{display:grid;grid-template-columns:1fr 1fr;}
    .hub{grid-template-columns:repeat(4,1fr);}
    .card,.row,.jeep-card,.act,.hub button,.tbl-wrap,.date-nav{background:var(--paper);}
    .tbl th:first-child,.tbl td:first-child{background:var(--paper);}
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-width:92vw;border-radius:22px;max-height:88vh;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .3s var(--ease);padding:14px 26px 26px;}
    .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;}
    .sheet-handle{display:none;}
    .fab{right:36px;bottom:36px;}
    .toast{bottom:36px;}
    .row:hover,.act:hover,.hub button:hover{border-color:rgba(43,32,22,.25);}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand-mark">AT</div>
        <h1 id="pageTitle">Aryan Trades</h1>
      </div>
      <div class="top-right">
        <span class="sync-dot" id="syncDot" title="Not signed in — data only on this device"></span>
        <label class="date-chip" aria-label="Change date">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span id="dateLabel"></span>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= storage =================
     Guest data lives under DB_KEY. Once signed in, the account's data is
     cached under CLOUD_KEY instead, so signing out returns to guest data. */
  var DB_KEY = 'aryanTradesDB_v1';
  var CLOUD_KEY = 'aryanTradesCloudCache_v1';
  var BACKUP_KEY = 'aryanTradesLastBackup';
  var AUTH_FLAG_KEY = 'aryanTradesAuthUsed';
  var COLLS = ['clients','jeeps','trucks','farmPays','loads','sales','receipts','dead','stock','handovers','expenses','transfers','workers','attendance'];

  function defaultDB(){
    var d = { settings:{ company:'Aryan Trades', labourPer100:0, openingCash:0, openingBank:0 }, rates:{} };
    COLLS.forEach(function(c){ d[c] = []; });
    return d;
  }
  function normalize(p){
    var d = defaultDB();
    if(p && typeof p === 'object'){
      COLLS.forEach(function(c){ if(Array.isArray(p[c])) d[c] = p[c]; });
      if(p.settings && typeof p.settings === 'object') for(var k in p.settings) d.settings[k] = p.settings[k];
      if(p.rates && typeof p.rates === 'object') d.rates = p.rates;
    }
    return d;
  }
  function authFlag(){ try{ return localStorage.getItem(AUTH_FLAG_KEY)==='1'; }catch(e){ return false; } }
  function storeKey(){ return authFlag() ? CLOUD_KEY : DB_KEY; }
  function load(key){
    try{ var raw = localStorage.getItem(key || storeKey()); return raw ? normalize(JSON.parse(raw)) : defaultDB(); }
    catch(e){ return defaultDB(); }
  }
  var db = load();
  function save(){
    _stock = null;
    try{ localStorage.setItem(storeKey(), JSON.stringify(db)); return true; }
    catch(e){ toast('Save failed — storage full. Download a backup!'); return false; }
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function isEmptyDB(d){ return COLLS.every(function(c){ return !(d[c]||[]).length; }); }

  /* ================= cloud sync (optional account) =================
     Same Firebase project as Dairy Ledger, but everything lives under its own
     root (at_users/{uid}/...), so the two apps never touch each other's data.
     One Firestore document per record — two devices editing different
     records never overwrite each other. */
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyC4mBfQDO5cZXOWX6vNIshmg4NyJxP2yJI",
    authDomain: "dairy-ledger-8d2e4.firebaseapp.com",
    projectId: "dairy-ledger-8d2e4",
    storageBucket: "dairy-ledger-8d2e4.firebasestorage.app",
    messagingSenderId: "557857723065",
    appId: "1:557857723065:web:b42e234a90a8224d31c168"
  };
  var FB_VER = '10.14.1';
  var CLOUD_ROOT = 'at_users';
  var CLOUD_COLLS = COLLS.concat(['rates','meta']);
  var authUser = null, fb = null, fbPromise = null, unsubs = [], pendingOps = [];

  function loadFirebase(){
    if(fbPromise) return fbPromise;
    var base = 'https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    fbPromise = Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]).then(function(m){
      var app = m[0].initializeApp(FIREBASE_CONFIG, 'aryan-trades');
      var fs;
      try{ fs = m[2].initializeFirestore(app, { localCache: m[2].persistentLocalCache({ tabManager: m[2].persistentMultipleTabManager() }) }); }
      catch(e){ fs = m[2].getFirestore(app); }
      fb = { authMod:m[1], fsMod:m[2], auth:m[1].getAuth(app), fs:fs };
      return fb;
    }).catch(function(err){ fbPromise = null; throw err; });
    return fbPromise;
  }
  function cleanRec(r){ return JSON.parse(JSON.stringify(r)); }
  function cloudDoc(coll, id){ return fb.fsMod.doc(fb.fs, CLOUD_ROOT, authUser.uid, coll, id); }
  function cloudPut(coll, rec){
    if(authUser && fb) fb.fsMod.setDoc(cloudDoc(coll, rec.id), cleanRec(rec)).catch(function(){ toast('Could not sync — will retry when online'); });
    else if(authFlag()) pendingOps.push({ op:'put', coll:coll, rec:cleanRec(rec) });
  }
  function cloudDel(coll, id){
    if(authUser && fb) fb.fsMod.deleteDoc(cloudDoc(coll, id)).catch(function(){});
    else if(authFlag()) pendingOps.push({ op:'del', coll:coll, id:id });
  }
  function cloudShape(d){
    var out = {};
    COLLS.forEach(function(c){ out[c] = d[c] || []; });
    out.rates = Object.keys(d.rates||{}).map(function(k){ return { id:k, rate:d.rates[k] }; });
    out.meta = [Object.assign({ id:'settings' }, d.settings)];
    return out;
  }
  function commitChunks(ops){
    var chain = Promise.resolve();
    for(var i=0;i<ops.length;i+=400){
      (function(slice){
        chain = chain.then(function(){
          var b = fb.fsMod.writeBatch(fb.fs);
          slice.forEach(function(o){ if(o.del) b.delete(o.ref); else b.set(o.ref, o.data); });
          return b.commit();
        });
      })(ops.slice(i, i+400));
    }
    return chain;
  }
  function uploadAll(uidStr, d, skipMeta){
    var shaped = cloudShape(d), ops = [];
    CLOUD_COLLS.forEach(function(c){
      if(skipMeta && c==='meta') return;
      shaped[c].forEach(function(r){ ops.push({ ref: fb.fsMod.doc(fb.fs, CLOUD_ROOT, uidStr, c, r.id), data: cleanRec(r) }); });
    });
    return commitChunks(ops);
  }
  function cloudReplaceAll(d){
    if(!authUser || !fb) return;
    Promise.all(CLOUD_COLLS.map(function(c){ return fb.fsMod.getDocs(fb.fsMod.collection(fb.fs, CLOUD_ROOT, authUser.uid, c)); })).then(function(snaps){
      var ops = [];
      snaps.forEach(function(s){ s.forEach(function(docSnap){ ops.push({ del:true, ref:docSnap.ref }); }); });
      return commitChunks(ops);
    }).then(function(){ return uploadAll(authUser.uid, d); }).catch(function(){ toast('Could not sync the restore — try again online'); });
  }
  function cloudIsEmpty(uidStr){
    return Promise.all(CLOUD_COLLS.map(function(c){ return fb.fsMod.getDocs(fb.fsMod.collection(fb.fs, CLOUD_ROOT, uidStr, c)); }))
      .then(function(snaps){ return snaps.every(function(s){ return s.empty; }); });
  }
  function detach(){ unsubs.forEach(function(u){ u(); }); unsubs = []; }
  function attach(uidStr){
    detach();
    CLOUD_COLLS.forEach(function(c){
      var ref = fb.fsMod.collection(fb.fs, CLOUD_ROOT, uidStr, c);
      unsubs.push(fb.fsMod.onSnapshot(ref, function(snap){
        var docs = snap.docs.map(function(x){ return x.data(); });
        if(c==='rates'){ db.rates = {}; docs.forEach(function(r){ db.rates[r.id] = r.rate; }); }
        else if(c==='meta'){
          var s = docs.find(function(x){ return x.id==='settings'; });
          if(s){ var ns = defaultDB().settings; for(var k in s) if(k!=='id') ns[k] = s[k]; db.settings = ns; }
        } else db[c] = docs;
        save(); render();
      }, function(){ toast('Sync error — check your connection'); }));
    });
  }
  function flushPending(){
    var ops = pendingOps; pendingOps = [];
    ops.forEach(function(o){ if(o.op==='put') cloudPut(o.coll, o.rec); else cloudDel(o.coll, o.id); });
  }
  function friendlyAuthError(err){
    var map = {
      'auth/email-already-in-use':'That email already has an account — use Log In instead.',
      'auth/invalid-email':'That doesn\'t look like a valid email.',
      'auth/weak-password':'Password should be at least 6 characters.',
      'auth/wrong-password':'Wrong password.', 'auth/invalid-credential':'Wrong email or password.',
      'auth/user-not-found':'No account with that email.',
      'auth/network-request-failed':'No internet — try again once online.',
      'auth/too-many-requests':'Too many attempts. Wait a bit and try again.'
    };
    return (err && map[err.code]) || (err && !err.code && err.message) || 'Something went wrong. Please try again.';
  }
  function finishSignIn(user, msg){
    authUser = user;
    try{ localStorage.setItem(AUTH_FLAG_KEY, '1'); }catch(e){}
    db = load(CLOUD_KEY);
    attach(user.uid);
    closeSheet(); toast(msg || ('Signed in as '+user.email)); render();
  }
  function performSignIn(isSignUp, email, pass){
    var guest = db;
    return loadFirebase().then(function(x){
      return (isSignUp ? x.authMod.createUserWithEmailAndPassword : x.authMod.signInWithEmailAndPassword)(x.auth, email, pass);
    }).then(function(cred){
      var user = cred.user;
      return cloudIsEmpty(user.uid).then(function(empty){
        if(isEmptyDB(guest)) return finishSignIn(user);
        if(empty) return uploadAll(user.uid, guest).then(function(){ finishSignIn(user, 'Signed in — your data is now in your account'); });
        askMerge(user, guest);
      });
    }).catch(function(err){ toast(friendlyAuthError(err)); });
  }
  function askMerge(user, guest){
    openSheet('<h2>Data on this device</h2><p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;">Your account already has data, and this device also has entries that aren\'t in the account yet.</p>' +
      '<button class="btn btn-primary" id="mgMerge" style="margin-bottom:10px;">Add this device\'s entries to the account</button>' +
      '<button class="btn btn-ghost" id="mgKeep">Use account data only</button>',
      function(root){
        f(root,'mgMerge').onclick = function(){
          this.disabled = true;
          uploadAll(user.uid, guest, true).then(function(){ finishSignIn(user, 'Merged into your account'); })
            .catch(function(){ toast('Could not upload — try again online'); });
        };
        f(root,'mgKeep').onclick = function(){ finishSignIn(user); };
      });
  }
  function performSignOut(){
    if(!fb) return;
    fb.authMod.signOut(fb.auth).then(function(){
      authUser = null; detach();
      try{ localStorage.removeItem(AUTH_FLAG_KEY); }catch(e){}
      db = load(DB_KEY); toast('Signed out'); render();
    });
  }
  function restoreSession(){
    if(!authFlag()) return;
    loadFirebase().then(function(x){
      var un = x.authMod.onAuthStateChanged(x.auth, function(user){
        un();
        if(user){ authUser = user; flushPending(); attach(user.uid); render(); }
        else { try{ localStorage.removeItem(AUTH_FLAG_KEY); }catch(e){} db = load(DB_KEY); render(); }
      });
    }).catch(function(){ /* offline and SDK not cached yet: keep showing the cached copy */ });
  }
  function openAuthSheet(mode){
    var html = '<h2>Account</h2>' + segmented('auMode', [['login','Log In'],['signup','Create account']], mode) +
      '<div class="field" style="margin-top:14px;"><label>Email</label><input type="email" id="auEmail" autocomplete="email"></div>' +
      '<div class="field"><label>Password</label><input type="password" id="auPass" autocomplete="current-password"></div>' +
      '<div class="field" id="auConfWrap" style="display:'+(mode==='signup'?'':'none')+'"><label>Confirm password</label><input type="password" id="auConf" autocomplete="new-password"></div>' +
      '<button class="btn btn-primary" id="auGo">'+(mode==='signup'?'Create account':'Log In')+'</button>' +
      '<button class="btn btn-ghost" id="auForgot" style="margin-top:10px;">Forgot password?</button>' +
      '<p class="hint" style="margin-top:12px;">Use the same email &amp; password on your phone and laptop to see the same data on both.</p>';
    openSheet(html, function(root){
      var m = wireSeg(root, 'auMode', function(v){ f(root,'auConfWrap').style.display = v==='signup' ? '' : 'none'; f(root,'auGo').textContent = v==='signup' ? 'Create account' : 'Log In'; });
      f(root,'auGo').onclick = function(){
        var btn = this, email = f(root,'auEmail').value.trim(), pass = f(root,'auPass').value;
        if(!email || !pass){ toast('Enter email and password'); return; }
        if(m()==='signup' && pass !== f(root,'auConf').value){ toast('Passwords don\'t match'); return; }
        btn.disabled = true; btn.textContent = 'Please wait…';
        performSignIn(m()==='signup', email, pass).then(function(){ btn.disabled = false; btn.textContent = m()==='signup' ? 'Create account' : 'Log In'; });
      };
      f(root,'auForgot').onclick = function(){
        var email = f(root,'auEmail').value.trim();
        if(!email){ toast('Type your email above first'); return; }
        loadFirebase().then(function(x){ return x.authMod.sendPasswordResetEmail(x.auth, email); })
          .then(function(){ toast('Reset link sent — check your email'); }, function(err){ toast(friendlyAuthError(err)); });
      };
    });
  }

  /* ================= formatting ================= */
  function todayISO(){ var d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  function addDays(iso, n){ var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2]+n)).toISOString().slice(0,10); }
  function addMonths(iso, n){ var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1]-1+n, 1)).toISOString().slice(0,10); }
  function daysInMonth(iso){ var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate(); }
  function monthEnd(ym){ return ym + '-' + String(daysInMonth(ym+'-01')).padStart(2,'0'); }
  function r2(n){ return Math.round((Number(n)||0)*100)/100; }
  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function money(n){
    n = r2(n); var neg = n < 0; n = Math.abs(n);
    return (neg?'-':'') + '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:2, minimumFractionDigits:(n%1===0?0:2)});
  }
  function kg(n){ return r2(n).toLocaleString('en-IN', {maximumFractionDigits:2}) + ' kg'; }
  function kgN(n){ return r2(n).toLocaleString('en-IN', {maximumFractionDigits:2}); }
  function birds(n){ n = Math.round(Number(n)||0); return n.toLocaleString('en-IN') + ' bird' + (n===1?'':'s'); }
  function pct(part, whole){ return whole > 0 ? (Math.round(part/whole*1000)/10) + '%' : '—'; }
  function dateLabel(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', {weekday:'short', day:'2-digit', month:'short', year:'numeric'}); }
  function dateShort(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', {day:'2-digit', month:'short'}); }
  function chipLabel(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', {weekday:'short', day:'2-digit', month:'short'}); }
  function monthLabel(ym){ var p = ym.split('-'); return new Date(+p[0], +p[1]-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sum(list, fn){ return list.reduce(function(s,x){ return s + (Number(typeof fn==='function' ? fn(x) : x[fn])||0); }, 0); }
  function byDateDesc(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); }
  function byDateAsc(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); }
  function inMonth(ym){ return function(x){ return !!x.date && x.date.slice(0,7)===ym; }; }

  var EXP_CATS = [
    ['diesel','Diesel / fuel'], ['repair','Jeep repair'], ['driver','Driver salary'], ['helper','Helper salary'],
    ['food','Food (staff)'], ['farmwage','Farm staff wages'], ['labour','Labour (other)'], ['house','House expense'], ['other','Other']
  ];
  function catLabel(k){ var c = EXP_CATS.find(function(x){ return x[0]===k; }); return c ? c[1] : 'Other'; }
  var ROLES = [['driver','Driver'],['helper','Helper'],['farm','Farm staff'],['labour','Labour'],['other','Other']];
  var ROLE_CAT = { driver:'driver', helper:'helper', farm:'farmwage', labour:'labour', other:'other' };
  function roleLabel(k){ var r = ROLES.find(function(x){ return x[0]===k; }); return r ? r[1] : 'Other'; }

  /* ================= lookups ================= */
  function clientById(id){ return db.clients.find(function(c){ return c.id===id; }); }
  function jeepById(id){ return db.jeeps.find(function(j){ return j.id===id; }); }
  function workerById(id){ return db.workers.find(function(w){ return w.id===id; }); }
  function jeepName(id){ var j = jeepById(id); return j ? j.name + (j.driver ? ' · '+j.driver : '') : ''; }
  function rateFor(clientId, date){
    var c = clientById(clientId);
    if(c && num(c.fixedRate) > 0) return num(c.fixedRate);
    return num(db.rates[date]) || '';
  }
  function farmNames(){
    var s = {}; db.trucks.forEach(function(t){ if(t.farm) s[t.farm] = 1; }); db.farmPays.forEach(function(p){ if(p.farm) s[p.farm] = 1; });
    return Object.keys(s).sort();
  }

  /* ================= stock (weight) tally =================
     Farm stock carries over day to day:
       expected closing = opening + truck in − sent in jeeps (net of returns) − dead
     A counted/weighed stock that day becomes the closing figure; the gap is
     recorded as farm weight loss. */
  var _stock = null;
  function computeDay(d, open){
    var tr = db.trucks.filter(function(x){ return x.date===d; });
    var ld = db.loads.filter(function(x){ return x.date===d; });
    var dd = db.dead.filter(function(x){ return x.date===d; });
    var loads = ld.filter(function(x){ return x.type!=='return'; }), rets = ld.filter(function(x){ return x.type==='return'; });
    var o = {
      open: open,
      inB: sum(tr,'birds'), inK: r2(sum(tr,'kg')),
      outB: sum(loads,'birds') - sum(rets,'birds'), outK: r2(sum(loads,'kg') - sum(rets,'kg')),
      deadB: sum(dd,'birds'), deadK: r2(sum(dd,'kg'))
    };
    o.exp = { birds: open.birds + o.inB - o.outB - o.deadB, kg: r2(open.kg + o.inK - o.outK - o.deadK) };
    o.birdsKnown = ld.concat(dd).every(function(x){ return num(x.birds) > 0 || !(num(x.kg) > 0); });
    if(!o.birdsKnown) o.exp.birds = 0;
    var cnt = db.stock.find(function(x){ return x.date===d; });
    o.counted = cnt || null;
    o.close = cnt ? { birds: num(cnt.birds), kg: num(cnt.kg) } : o.exp;
    o.lossK = cnt ? r2(o.exp.kg - o.close.kg) : 0;
    return o;
  }
  function stockSeries(){
    if(_stock) return _stock;
    var set = {};
    ['trucks','loads','dead','stock'].forEach(function(c){ db[c].forEach(function(x){ set[x.date] = 1; }); });
    var dates = Object.keys(set).sort(), out = {}, cur = { birds:0, kg:0 };
    dates.forEach(function(d){ var o = computeDay(d, cur); out[d] = o; cur = { birds:o.close.birds, kg:o.close.kg }; });
    _stock = { dates:dates, byDate:out };
    return _stock;
  }
  function stockBefore(d){
    var s = stockSeries();
    for(var i=s.dates.length-1;i>=0;i--) if(s.dates[i] < d) return s.byDate[s.dates[i]].close;
    return { birds:0, kg:0 };
  }
  function stockOn(d){ var s = stockSeries(); return s.byDate[d] || computeDay(d, stockBefore(d)); }

  /* ================= jeep day =================
     Cash the driver should hand over = cash sales + udhar collected in cash on
     the road − expenses the driver paid out of that cash. */
  function jeepDay(jeepId, d){
    function mine(x){ return x.date===d && x.jeepId===jeepId; }
    var ld = db.loads.filter(mine);
    var loads = ld.filter(function(x){ return x.type!=='return'; }), rets = ld.filter(function(x){ return x.type==='return'; });
    var sales = db.sales.filter(mine);
    var rc = db.receipts.filter(function(x){ return mine(x) && x.mode==='cash'; });
    var ex = db.expenses.filter(function(x){ return mine(x) && x.mode==='driver'; });
    var hv = db.handovers.filter(mine);
    var o = {
      ld:ld, sales:sales, hv:hv, rc:rc, ex:ex,
      loadK: r2(sum(loads,'kg')), retK: r2(sum(rets,'kg')),
      soldK: r2(sum(sales,'kg')), amt: r2(sum(sales,'amount')), cash: r2(sum(sales,'cash')), online: r2(sum(sales,'online')), udhar: r2(sum(sales,'udhar')),
      rcash: r2(sum(rc,'amount')), exCash: r2(sum(ex,'amount')), handed: r2(sum(hv,'amount'))
    };
    o.netK = r2(o.loadK - o.retK);
    o.lossK = r2(o.netK - o.soldK);
    o.toHand = r2(o.cash + o.rcash - o.exCash);
    o.diff = r2(o.handed - o.toHand);
    o.active = ld.length || sales.length || hv.length || rc.length || ex.length;
    return o;
  }

  /* ================= money ================= */
  function balances(d){
    function le(x){ return x.date <= d; }
    var cash = num(db.settings.openingCash), bank = num(db.settings.openingBank);
    cash += sum(db.handovers.filter(le), 'amount');
    bank += sum(db.sales.filter(le), 'online');
    db.receipts.filter(le).forEach(function(r){ if(r.mode==='online') bank += num(r.amount); else if(!r.jeepId) cash += num(r.amount); });
    db.trucks.filter(le).forEach(function(t){
      if(t.payMode==='bank') bank -= num(t.paid); else cash -= num(t.paid);
      cash -= num(t.freight) + num(t.labour);
    });
    db.farmPays.filter(le).forEach(function(p){ if(p.mode==='bank') bank -= num(p.amount); else cash -= num(p.amount); });
    db.expenses.filter(le).forEach(function(e){ if(e.mode==='bank') bank -= num(e.amount); else if(e.mode==='cash') cash -= num(e.amount); });
    db.transfers.filter(le).forEach(function(t){ var a = num(t.amount); if(t.dir==='c2b'){ cash -= a; bank += a; } else { cash += a; bank -= a; } });
    return { cash:r2(cash), bank:r2(bank) };
  }
  function clientBalance(cid){
    var c = clientById(cid);
    var bal = num(c && c.openingUdhar);
    db.sales.forEach(function(s){ if(s.clientId===cid) bal += num(s.udhar); });
    db.receipts.forEach(function(r){ if(r.clientId===cid) bal -= num(r.amount); });
    return r2(bal);
  }
  function udharTotals(){
    var owed = 0, adv = 0;
    db.clients.forEach(function(c){ var b = clientBalance(c.id); if(b > 0) owed += b; else adv -= b; });
    return { owed:r2(owed), adv:r2(adv) };
  }
  function farmBalances(){
    var m = {};
    db.trucks.forEach(function(t){ var k = t.farm||'Unknown farm'; m[k] = (m[k]||0) + num(t.amount) - num(t.paid); });
    db.farmPays.forEach(function(p){ var k = p.farm||'Unknown farm'; m[k] = (m[k]||0) - num(p.amount); });
    return Object.keys(m).map(function(k){ return { farm:k, due:r2(m[k]) }; }).filter(function(x){ return Math.abs(x.due) > 0.004; })
      .sort(function(a,b){ return b.due - a.due; });
  }

  /* ================= staff =================
     Monthly workers earn salary/days-in-month for every day except absences
     (unmarked days count as present). Daily-wage workers earn only on days
     marked present. Payments to workers are stored as expenses (with
     workerId), so they flow into cash/bank and profit automatically. */
  function attOf(wid, d){ return db.attendance.find(function(a){ return a.workerId===wid && a.date===d; }); }
  function attStatus(w, d){ var a = attOf(w.id, d); return a ? a.s : (w.payType==='daily' ? '' : 'P'); }
  function dayEarn(w, d){
    var s = attStatus(w, d), fr = s==='P' ? 1 : s==='H' ? 0.5 : 0;
    return w.payType==='daily' ? num(w.wage) * fr : num(w.salary) / daysInMonth(d) * fr;
  }
  function workerPays(wid){ return db.expenses.filter(function(e){ return e.workerId===wid; }); }
  function workerPeriod(w, from, to){
    var o = { P:0, H:0, A:0, earned:0 };
    var start = w.start && w.start > from ? w.start : from;
    var end = to > todayISO() ? todayISO() : to;
    for(var d = start; d <= end; d = addDays(d, 1)){
      var s = attStatus(w, d);
      if(s==='P') o.P++; else if(s==='H') o.H++; else if(s==='A') o.A++;
      o.earned += dayEarn(w, d);
    }
    o.earned = r2(o.earned);
    return o;
  }
  function workerBalance(w){
    var e = workerPeriod(w, w.start || todayISO(), todayISO()).earned;
    return r2(e + num(w.openingDue) - sum(workerPays(w.id), 'amount'));
  }
  function workerMonth(w, ym){
    var p = workerPeriod(w, ym+'-01', monthEnd(ym));
    var pays = workerPays(w.id).filter(inMonth(ym));
    p.paidSalary = r2(sum(pays.filter(function(e){ return e.kind!=='advance'; }),'amount'));
    p.paidAdvance = r2(sum(pays.filter(function(e){ return e.kind==='advance'; }),'amount'));
    return p;
  }

  /* ================= reports ================= */
  function monthReport(ym){
    var M = inMonth(ym);
    var tr = db.trucks.filter(M), sa = db.sales.filter(M), ex = db.expenses.filter(M);
    var ld = db.loads.filter(M), dd = db.dead.filter(M);
    var r = {
      buyK: r2(sum(tr,'kg')), buyAmt: r2(sum(tr,'amount')),
      freight: r2(sum(tr,'freight')), labour: r2(sum(tr,'labour')), trucks: tr.length,
      sellK: r2(sum(sa,'kg')), sellAmt: r2(sum(sa,'amount')),
      cash: r2(sum(sa,'cash')), online: r2(sum(sa,'online')), udhar: r2(sum(sa,'udhar')),
      collected: r2(sum(db.receipts.filter(M),'amount')),
      deadK: r2(sum(dd,'kg')), deadB: sum(dd,'birds')
    };
    r.avgBuy = r.buyK > 0 ? r.buyAmt / r.buyK : 0;
    r.avgSell = r.sellK > 0 ? r.sellAmt / r.sellK : 0;
    var lastTruck = db.trucks.filter(function(t){ return t.date.slice(0,7) <= ym; }).sort(byDateDesc)[0];
    var valRate = r.avgBuy || (lastTruck ? num(lastTruck.rate) : 0);
    var first = ym + '-01';
    r.openStock = stockBefore(first); r.closeStock = stockBefore(addMonths(first, 1));
    r.stockChange = r2((r.closeStock.kg - r.openStock.kg) * valRate);
    r.jeepLossK = r2(sum(ld, function(x){ return x.type==='return' ? -num(x.kg) : num(x.kg); }) - r.sellK);
    var s = stockSeries();
    r.farmLossK = r2(s.dates.filter(function(d){ return d.slice(0,7)===ym; }).reduce(function(t,d){ return t + s.byDate[d].lossK; }, 0));
    r.totalLossK = r2(r.jeepLossK + r.farmLossK + r.deadK);
    r.cats = EXP_CATS.map(function(c){ return { key:c[0], label:c[1], amt: r2(sum(ex.filter(function(e){ return e.cat===c[0]; }),'amount')) }; })
      .filter(function(c){ return c.amt; });
    r.house = r2(sum(ex.filter(function(e){ return e.cat==='house'; }),'amount'));
    r.business = r2(sum(ex,'amount') - r.house);
    r.gross = r2(r.sellAmt - r.buyAmt + r.stockChange);
    r.profit = r2(r.gross - r.freight - r.labour - r.business);
    r.net = r2(r.profit - r.house);
    return r;
  }
  function monthDates(ym){
    var out = [], end = monthEnd(ym), t = todayISO();
    if(end > t) end = t;
    for(var d = ym+'-01'; d <= end; d = addDays(d,1)) out.push(d);
    return out;
  }
  function dailyRows(ym){
    var set = {};
    ['trucks','loads','sales','expenses','dead','stock','handovers','receipts'].forEach(function(c){ db[c].forEach(function(x){ if(x.date && x.date.slice(0,7)===ym) set[x.date] = 1; }); });
    return Object.keys(set).sort().map(function(d){
      var st = stockOn(d), jd = db.jeeps.map(function(j){ return jeepDay(j.id, d); });
      var diff = r2(jd.filter(function(o){ return o.hv.length; }).reduce(function(t,o){ return t + o.diff; }, 0));
      return { date:d, inK:st.inK, soldK:r2(sum(jd,'soldK')), jeepLoss:r2(sum(jd,'lossK')), farmLoss: st.counted ? st.lossK : null,
        deadK:st.deadK, sales:r2(sum(jd,'amt')), exp:r2(sum(db.expenses.filter(function(e){ return e.date===d; }),'amount')), diff:diff };
    });
  }
  function jeepRows(ym){
    var dates = monthDates(ym);
    return db.jeeps.map(function(j){
      var t = { j:j, netK:0, soldK:0, lossK:0, amt:0, cash:0, online:0, udhar:0, toHand:0, handed:0, diff:0, pending:0 };
      dates.forEach(function(d){
        var o = jeepDay(j.id, d);
        ['netK','soldK','lossK','amt','cash','online','udhar','toHand','handed'].forEach(function(k){ t[k] += o[k]; });
        if(o.hv.length) t.diff += o.diff; else t.pending += o.toHand;
      });
      ['netK','soldK','lossK','amt','cash','online','udhar','toHand','handed','diff','pending'].forEach(function(k){ t[k] = r2(t[k]); });
      return t;
    });
  }
  function clientRows(ym){
    var M = inMonth(ym);
    return db.clients.map(function(c){
      var s = db.sales.filter(function(x){ return x.clientId===c.id && M(x); });
      var rc = db.receipts.filter(function(x){ return x.clientId===c.id && M(x); });
      return { c:c, kg:r2(sum(s,'kg')), amt:r2(sum(s,'amount')), udhar:r2(sum(s,'udhar')), got:r2(sum(rc,'amount')), bal:clientBalance(c.id), n:s.length+rc.length };
    }).filter(function(x){ return x.n || Math.abs(x.bal) > 0.004; }).sort(function(a,b){ return b.amt - a.amt; });
  }
  function farmRows(ym){
    var M = inMonth(ym), bal = {};
    farmBalances().forEach(function(x){ bal[x.farm] = x.due; });
    var names = {}; db.trucks.filter(M).forEach(function(t){ names[t.farm||'Unknown farm'] = 1; }); db.farmPays.filter(M).forEach(function(p){ names[p.farm||'Unknown farm'] = 1; });
    return Object.keys(names).sort().map(function(n){
      var tr = db.trucks.filter(function(t){ return M(t) && (t.farm||'Unknown farm')===n; });
      var fp = db.farmPays.filter(function(p){ return M(p) && (p.farm||'Unknown farm')===n; });
      var k = sum(tr,'kg'), a = sum(tr,'amount');
      return { farm:n, trucks:tr.length, kg:r2(k), amt:r2(a), avg: k>0 ? r2(a/k) : 0, paid:r2(sum(tr,'paid') + sum(fp,'amount')), bal: bal[n]||0 };
    });
  }
  function salaryRows(ym){
    return db.workers.map(function(w){ return { w:w, m:workerMonth(w, ym), bal:workerBalance(w) }; });
  }

  function quickAction(k){

  function openTruckForm(id){
    var t = id ? db.trucks.find(function(x){ return x.id===id; }) : null;

    var html = '<h2>'+(t?'Edit':'Truck')+' Arrival</h2>' +
      '<datalist id="farmList">'+farmNames().map(function(n){ return '<option value="'+esc(n)+'">'; }).join('')+'</datalist>' +

      '<div class="field-row"><div class="field"><label>Birds</label><input type="number" id="tBirds" inputmode="numeric" value="'+(t&&t.birds?t.birds:'')+'"></div>' +
      '<div class="field"><label>Weight (kg)</label><input type="number" id="tKg" inputmode="decimal" step="0.01" value="'+(t?t.kg:'')+'"></div></div>' +
      '<div class="field-row"><div class="field"><label>Rate (₹/kg)</label><input type="number" id="tRate" inputmode="decimal" step="0.01" value="'+(t?t.rate:'')+'"></div>' +
      '<div class="field"><label>Chicken cost</label><input type="number" id="tAmt" readonly></div></div>' +
      '<div class="field-row"><div class="field"><label>Truck freight</label><input type="number" id="tFreight" inputmode="decimal" value="'+(t&&t.freight?t.freight:'')+'"></div>' +
      '<div class="field"><label>Loading labour</label><input type="number" id="tLabour" inputmode="decimal" value="'+(t?(t.labour||''):'')+'"></div></div>' +
      '<div class="hint" style="margin:-6px 0 12px;">'+(per100 ? 'Loading/unloading labour is worked out at '+money(per100)+' per 100 kg — change it if needed.' : 'Set the loading/unloading wage per 100 kg in More → Settings to fill this in automatically.')+' Freight &amp; labour are counted as paid in cash.</div>' +
      '<div class="field-row"><div class="field"><label>Paid to farm now</label><input type="number" id="tPaid" inputmode="decimal" value="'+(t&&t.paid?t.paid:'')+'" placeholder="0"></div>' +
      '<div class="field"><label>Paid from</label>'+segmented('tMode', [['bank','Bank'],['cash','Cash']], t?t.payMode||'bank':'bank')+'</div></div>' +
      '<div class="field"><label>Note (optional)</label><input type="text" id="tNote" value="'+esc(t?t.note||'':'')+'" placeholder="Truck no., driver…"></div>' +
      '<div class="btn-row">'+(t?'<button class="btn btn-danger" id="tDel">Delete</button>':'')+'<button class="btn btn-primary" id="tSave">Save</button></div>';
    openSheet(html, function(root){
      var mode = wireSeg(root, 'tMode');
      var labourTouched = !!(t && t.labour);
      function calc(){
        f(root,'tAmt').value = r2(num(f(root,'tKg').value) * num(f(root,'tRate').value));
        if(!labourTouched && per100) f(root,'tLabour').value = r2(num(f(root,'tKg').value)/100*per100) || '';
      }
      ['tKg','tRate'].forEach(function(i){ f(root,i).addEventListener('input', calc); });
      f(root,'tLabour').addEventListener('input', function(){ labourTouched = true; });
      calc();
      f(root,'tSave').onclick = function(){
        var kgV = num(f(root,'tKg').value);
        if(kgV <= 0){ toast('Enter the weight'); return; }
        var rec = t || { id:uid() };

        rec.paid = Math.min(num(f(root,'tPaid').value), rec.amount); rec.payMode = mode();

        upsert('trucks', rec); closeSheet(); toast('Truck saved'); render();
      };
      if(t) f(root,'tDel').onclick = function(){ removeRec('trucks', t.id, 'truck'); };
    });
  }

  function wireEntryRows(root){
    root.querySelectorAll('[data-load]').forEach(function(r){ r.onclick = function(){ openLoadForm(r.getAttribute('data-load')); }; });

    root.querySelectorAll('[data-exp]').forEach(function(r){ r.onclick = function(){ openExpenseForm(r.getAttribute('data-exp')); }; });
    root.querySelectorAll('[data-hand]').forEach(function(r){ r.onclick = function(){ openHandoverForm(r.getAttribute('data-hand')); }; });

  function payMode(s){
    var a = num(s.amount);
    if(a <= 0 || Math.abs(num(s.cash)-a) < 0.01) return 'cash';
    if(Math.abs(num(s.online)-a) < 0.01) return 'online';
    if(Math.abs(num(s.udhar)-a) < 0.01) return 'udhar';
    return 'split';
  }
  function payBadge(s){
    var m = payMode(s);
    return m==='cash' ? '<span class="badge good">Cash</span>' : m==='online' ? '<span class="badge plain">Online</span>' : m==='udhar' ? '<span class="badge bad">Udhar</span>' : '<span class="badge warn">Split</span>';
  }

        : '<button class="btn btn-ghost" id="sSave">Save</button><button class="btn btn-primary" id="sNext">Save &amp; next</button>')+'</div>';
    openSheet(html, function(root){
      var mode = wireSeg(root, 'sMode', sync);
      var cSel = f(root,'sClient');
      function amt(){ return r2(num(f(root,'sKg').value) * num(f(root,'sRate').value)); }
      function sync(){
        var a = amt(); f(root,'sAmt').value = a;
        var m = mode();
        f(root,'sSplit').style.display = m==='split' ? '' : 'none';
        f(root,'sUdLine').style.display = (m==='split' || m==='udhar') ? '' : 'none';
        f(root,'sUd').textContent = money(m==='udhar' ? a : Math.max(0, a - num(f(root,'sCash').value) - num(f(root,'sOnline').value)));
      }
      function clientChanged(fillRate){
        var v = cSel.value, line = f(root,'sBalLine');
        f(root,'sNewWrap').style.display = v==='__new' ? '' : 'none';
        if(v && v!=='__new'){
          var b = clientBalance(v);
          line.style.display = Math.abs(b) > 0.004 ? '' : 'none';
          line.innerHTML = '<span>'+(b>0?'Old udhar':'Advance with you')+'</span><b class="num" style="color:'+(b>0?'var(--bad)':'var(--good)')+'">'+money(Math.abs(b))+'</b>';
          if(fillRate){ var r = rateFor(v, f(root,'sDate').value); if(r) f(root,'sRate').value = r; }
        } else {
          line.style.display = 'none';
          if(fillRate && v==='__new'){ var dr = num(db.rates[f(root,'sDate').value]); if(dr) f(root,'sRate').value = dr; }
        }
        sync();
      }
      cSel.addEventListener('change', function(){ clientChanged(true); if(cSel.value==='__new') f(root,'sNewName').focus(); else f(root,'sKg').focus(); });
      ['sKg','sRate','sCash','sOnline'].forEach(function(i){ f(root,i).addEventListener('input', sync); });
      clientChanged(false);
      if(!s){ var dr = num(db.rates[date]); if(dr) f(root,'sRate').value = dr; sync(); }

      function doSave(next){
        var a = amt();
        if(num(f(root,'sKg').value) <= 0){ toast('Enter the weight'); return; }
        var cid = cSel.value, jid = f(root,'sJeep').value;
        if(!cid){ toast('Pick a client'); return; }
        if(cid==='__new'){
          var nm = f(root,'sNewName').value.trim();
          if(!nm){ toast('Enter the new client name'); return; }
          var nc = { id:uid(), name:nm, phone:'', fixedRate:0, openingUdhar:0, jeepId:jid };
          upsert('clients', nc); cid = nc.id;
        } else {
          var ec = clientById(cid);
          if(ec && !ec.jeepId){ ec.jeepId = jid; upsert('clients', ec); }
        }
        var rec = s || { id:uid() };
        rec.date = f(root,'sDate').value || state.date; rec.jeepId = jid; rec.clientId = cid;
        rec.birds = Math.round(num(f(root,'sBirds').value)); rec.kg = num(f(root,'sKg').value); rec.rate = num(f(root,'sRate').value); rec.amount = a;
        var m = mode();
        if(m==='cash'){ rec.cash = a; rec.online = 0; }
        else if(m==='online'){ rec.cash = 0; rec.online = a; }
        else if(m==='udhar'){ rec.cash = 0; rec.online = 0; }
        else { rec.cash = Math.min(num(f(root,'sCash').value), a); rec.online = Math.min(num(f(root,'sOnline').value), r2(a - rec.cash)); }
        rec.udhar = r2(a - rec.cash - rec.online);
        upsert('sales', rec); render();
        if(next){ toast('Saved — next sale'); openSaleForm(null, rec.jeepId, rec.date); f($sheetContent,'sClient').focus(); }
        else { closeSheet(); toast('Sale saved'); }
      }
      f(root,'sSave').onclick = function(){ doSave(false); };
      if(!s) f(root,'sNext').onclick = function(){ doSave(true); };
      if(s) f(root,'sDel').onclick = function(){ removeRec('sales', s.id, 'sale'); };
    });
  }

      return '<div class="row" data-client="'+x.c.id+'" data-name="'+esc(x.c.name.toLowerCase())+'"><div class="row-main"><div class="row-title">'+esc(x.c.name)+'</div>' +
        '<div class="row-sub">'+(num(x.c.fixedRate)>0 ? 'Fixed '+money(x.c.fixedRate)+'/kg' : 'Daily rate')+(x.c.jeepId && state.udharView==='all' ? ' · '+esc(jeepName(x.c.jeepId)) : '')+'</div></div>' +

      groups.filter(function(g){ return g.items.length; }).forEach(function(g){

    f($view,'uPay').onclick = function(){ openReceiptForm(); };

      kpi('Paid this month', money(sum(db.expenses.filter(function(e){ return e.workerId && e.date.slice(0,7)===d.slice(0,7); }),'amount')), monthLabel(d.slice(0,7)), 'gold') + '</div>';

  function buildExcel(X, ym, all){
    var wb = X.utils.book_new(), co = db.settings.company || 'Aryan Trades';
    var pick = all ? function(){ return true; } : inMonth(ym);
    function add(name, rows, widths){
      var ws = X.utils.aoa_to_sheet(rows);
      ws['!cols'] = (widths || rows[0].map(function(){ return 14; })).map(function(w){ return { wch:w }; });
      X.utils.book_append_sheet(wb, ws, name.slice(0,31));
    }
    function cn(id){ var c = clientById(id); return c ? c.name : ''; }
    function jn(id){ var j = jeepById(id); return j ? j.name : ''; }
    function jd(id){ var j = jeepById(id); return j ? (j.driver||'') : ''; }
    var r = monthReport(ym), mLab = monthLabel(ym);

    var p = [[co+' — Profit '+mLab], [], ['Item','Amount (₹)','Detail'],
      ['Sales', r.sellAmt, r2(r.sellK)+' kg'], ['Chicken bought', -r.buyAmt, r2(r.buyK)+' kg'], ['Stock change at farm', r.stockChange, r2(r.openStock.kg)+' → '+r2(r.closeStock.kg)+' kg'],
      ['Margin on chicken', r.gross, ''], ['Truck freight', -r.freight, ''], ['Loading/unloading labour', -r.labour, '']];
    r.cats.filter(function(c){ return c.key!=='house'; }).forEach(function(c){ p.push([c.label, -c.amt, '']); });
    p.push(['Business profit', r.profit, ''], ['House expenses', -r.house, ''], ['Left after house', r.net, ''], [],
      ['Weight', 'kg', ''], ['Bought', r.buyK, r.trucks+' trucks'], ['Sold', r.sellK, ''], ['Dead birds', r.deadK, r.deadB+' birds'],
      ['Jeep weight loss', r.jeepLossK, ''], ['Farm weight loss', r.farmLossK, ''], ['Total loss', r.totalLossK, pct(r.totalLossK, r.buyK)], [],
      ['Money in', '₹', ''], ['Cash sales', r.cash, ''], ['Online sales', r.online, ''], ['Given on udhar', r.udhar, ''], ['Udhar collected', r.collected, '']);
    add('Profit', p, [28,16,26]);

    add('Daily', [['Date','Truck in kg','Sold kg','Jeep loss kg','Farm loss kg','Dead kg','Sales ₹','Expenses ₹','Cash short/extra ₹']].concat(
      dailyRows(ym).map(function(x){ return [x.date, x.inK, x.soldK, x.jeepLoss, x.farmLoss==null?'':x.farmLoss, x.deadK, x.sales, x.exp, x.diff]; })), [12,12,11,12,12,10,12,12,16]);
    add('Jeeps', [['Jeep','Driver','Loaded kg','Sold kg','Loss kg','Sales ₹','Cash ₹','Online ₹','Udhar ₹','Should hand ₹','Handed ₹','Not handed yet ₹','Short/extra ₹']].concat(
      jeepRows(ym).map(function(x){ return [x.j.name, x.j.driver||'', x.netK, x.soldK, x.lossK, x.amt, x.cash, x.online, x.udhar, x.toHand, x.handed, x.pending, x.diff]; })), [14,14,11,11,10,12,12,12,12,13,12,15,13]);
    add('Salary', [['Worker','Role','Pay type','Rate ₹','Present','Half days','Absent','Earned ₹','Salary paid ₹','Advance ₹','Balance now ₹ (+ to pay / − advance)']].concat(
      salaryRows(ym).map(function(x){ return [x.w.name, roleLabel(x.w.role), x.w.payType==='daily'?'Daily':'Monthly', x.w.payType==='daily'?num(x.w.wage):num(x.w.salary), x.m.P, x.m.H, x.m.A, x.m.earned, x.m.paidSalary, x.m.paidAdvance, x.bal]; })), [18,12,10,10,9,9,8,12,13,11,30]);
    var dates = monthDates(ym);
    add('Attendance', [['Worker'].concat(dates.map(function(d){ return +d.slice(8); }))].concat(
      db.workers.map(function(w){ return [w.name].concat(dates.map(function(d){ if(w.start && d < w.start) return ''; var s = attStatus(w, d); return s==='H' ? '½' : s; })); })),
      [18].concat(dates.map(function(){ return 4; })));
    add('Udhar list', [['Client','Phone','Driver','Rate','Balance ₹ (+ owes you / − advance)']].concat(
      db.clients.map(function(c){ return [c.name, c.phone||'', jn(c.jeepId)+(jd(c.jeepId)?' · '+jd(c.jeepId):''), num(c.fixedRate)>0?num(c.fixedRate):'Daily', clientBalance(c.id)]; })
        .sort(function(a,b){ return b[4]-a[4]; })), [22,14,20,10,30]);
    add('Sales', [['Date','Jeep','Driver','Client','Birds','Kg','Rate','Amount','Cash','Online','Udhar']].concat(
      db.sales.filter(pick).sort(byDateAsc).map(function(s){ return [s.date, jn(s.jeepId), jd(s.jeepId), cn(s.clientId), num(s.birds)||'', num(s.kg), num(s.rate), num(s.amount), num(s.cash), num(s.online), num(s.udhar)]; })), [11,12,12,20,7,9,8,11,10,10,10]);
    add('Trucks', [['Date','Farm','Birds','Kg','Rate','Chicken cost','Freight','Loading labour','Paid now','Paid from','Note']].concat(
      db.trucks.filter(pick).sort(byDateAsc).map(function(t){ return [t.date, t.farm||'', num(t.birds)||'', num(t.kg), num(t.rate), num(t.amount), num(t.freight), num(t.labour), num(t.paid), t.payMode==='bank'?'Bank':'Cash', t.note||'']; })), [11,18,8,10,8,13,10,13,11,10,18]);
    add('Farm payments', [['Date','Farm','Amount','Paid from']].concat(
      db.farmPays.filter(pick).sort(byDateAsc).map(function(x){ return [x.date, x.farm, num(x.amount), x.mode==='bank'?'Bank':'Cash']; })), [11,20,12,10]);
    add('Jeep loading', [['Date','Jeep','Type','Birds','Kg']].concat(
      db.loads.filter(pick).sort(byDateAsc).map(function(l){ return [l.date, jn(l.jeepId), l.type==='return'?'Returned':'Loaded', num(l.birds)||'', num(l.kg)]; })), [11,14,10,8,10]);
    add('Udhar payments', [['Date','Client','Amount','Mode','Collected by']].concat(
      db.receipts.filter(pick).sort(byDateAsc).map(function(x){ return [x.date, cn(x.clientId), num(x.amount), x.mode==='online'?'Online':'Cash', x.jeepId ? jn(x.jeepId) : 'Owner']; })), [11,20,11,9,14]);
    add('Expenses', [['Date','Type','Amount','Paid from','Jeep','Worker','Salary/Advance','Note']].concat(
      db.expenses.filter(pick).sort(byDateAsc).map(function(e){ var w = workerById(e.workerId); return [e.date, catLabel(e.cat), num(e.amount), e.mode==='bank'?'Bank':e.mode==='driver'?'Driver cash':'Cash', jn(e.jeepId), w?w.name:'', e.workerId?(e.kind==='advance'?'Advance':'Salary'):'', e.note||'']; })), [11,18,11,12,12,16,14,24]);
    add('Cash handover', [['Date','Jeep','Driver','Amount']].concat(
      db.handovers.filter(pick).sort(byDateAsc).map(function(h){ return [h.date, jn(h.jeepId), jd(h.jeepId), num(h.amount)]; })), [11,14,14,12]);
    add('Dead birds', [['Date','Birds','Kg','Note']].concat(
      db.dead.filter(pick).sort(byDateAsc).map(function(x){ return [x.date, num(x.birds)||'', num(x.kg), x.note||'']; })), [11,8,8,20]);

    X.writeFile(wb, co.replace(/[^a-z0-9]+/gi,'-') + '-' + ym + (all?'-all':'') + '.xlsx');
  }

  /* ================= backup ================= */
  function exportData(){
    var blob = new Blob([JSON.stringify(db, null, 1)], { type:'application/json' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'aryan-trades-backup-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    try{ localStorage.setItem(BACKUP_KEY, todayISO()); }catch(e){}
    toast('Backup downloaded'); render();
  }
  function importData(ev){
    var file = ev.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ toast('Not a valid backup file'); return; }
      if(!parsed || !Array.isArray(parsed.sales)){ toast('Not an Aryan Trades backup'); return; }
      confirmThen('Restore backup?', 'All current data'+(authUser?' in your account':' on this device')+' will be replaced with the backup.', 'Restore', function(){
        db = normalize(parsed); save(); cloudReplaceAll(db); toast('Backup restored'); render();
      });
    };
    reader.readAsText(file);
    ev.target.value = '';
  }

  function render(){

    $title.textContent = state.tab==='today' ? co : (state.tab==='more' && state.sub ? SUB_TITLES[state.sub] : TITLES[state.tab]);

    $datePick.value = state.date;
    var dot = document.getElementById('syncDot');
    dot.classList.toggle('on', !!authUser);
    dot.title = authUser ? 'Synced to '+authUser.email : 'Not signed in — data only on this device';
    $fab.classList.toggle('hidden', !(FAB[state.tab] || (state.tab==='more' && state.sub==='trucks')));
    ({ today:renderToday, jeeps:renderJeeps, udhar:renderUdhar, staff:renderStaff, expenses:renderExpenses, more:renderMore })[state.tab]();
  }
  render();
  restoreSession();

  if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
