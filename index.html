<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Aryan Traders</title>
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aryan Traders">
<style>
  :root{
    --bg:#eef2f7;
    --surface:#ffffff;
    --surface-2:#f6f8fb;
    --ink:#0f172a;
    --ink-soft:#475569;
    --ink-faint:#8391a7;
    --line:#e2e8f0;
    --line-2:#cbd5e1;
    --navy:#0b1f3a;
    --navy-2:#16325c;
    --red:#d6202f;
    --red-dark:#a3151f;
    --red-soft:#fdecee;
    --blue:#1d4ed8;
    --blue-soft:#e8efff;
    --good:#15803d;
    --good-soft:#e6f5eb;
    --bad:#dc2626;
    --bad-soft:#fdeceb;
    --warn:#b45309;
    --warn-soft:#fff3dc;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px -10px rgba(15,23,42,.18);
    --shadow-lg:0 24px 60px -20px rgba(11,31,58,.45);
    --ease:cubic-bezier(.16,.84,.44,1);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}
  h1,h2,h3{font-weight:700;letter-spacing:-0.01em;color:var(--ink);}
  .num{font-variant-numeric:tabular-nums;}

  .app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(var(--safe-top) + 8px);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px;gap:10px;}
  .logo{display:flex;align-items:center;gap:8px;min-width:0;}
  .logo svg{width:38px;height:38px;flex-shrink:0;}
  .logo-text{display:flex;flex-direction:column;line-height:1;min-width:0;}
  .logo-name{font-weight:900;color:var(--red);font-size:17px;letter-spacing:.02em;white-space:nowrap;}
  .logo-sub{font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .sync-dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);}
  .sync-dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);}
  .date-chip{position:relative;display:flex;align-items:center;gap:6px;background:var(--navy);color:#fff;padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px;}
  .date-chip svg{width:14px;height:14px;opacity:.85;}
  .date-chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
  .page-title{display:none;}

  .view{flex:1;padding:14px 14px calc(110px + var(--safe-bottom));overflow-x:hidden;width:100%;}
  .section-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .section-title:first-child{margin-top:2px;}
  .section-title button{font-size:12.5px;letter-spacing:0;text-transform:none;color:#fff;background:var(--navy);font-weight:700;padding:6px 12px;border-radius:8px;}
  .section-title .st-sub{font-size:12px;letter-spacing:0;text-transform:none;font-weight:700;color:var(--ink-faint);}

  .date-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:14px;box-shadow:var(--shadow);}
  .date-nav button{width:40px;height:36px;border-radius:9px;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--ink-soft);}
  .date-nav .dn-label{font-weight:800;font-size:14px;text-align:center;}
  .date-nav .dn-sub{display:block;font-size:11px;font-weight:700;color:var(--blue);}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--blue);margin-bottom:12px;}

  /* ---------- home hero ---------- */
  .hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.05);}
  .hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1;}
  .hero-k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;}
  .hero-rate{font-size:24px;font-weight:800;margin-top:2px;}
  .hero-btn{background:var(--red);color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px;flex-shrink:0;}
  .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;position:relative;z-index:1;}
  .hero-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;min-width:0;}
  .hero-stat b{display:block;font-size:18px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hero-stat small{display:block;font-size:11px;opacity:.7;margin-top:1px;}
  .hero-stat.hot b{color:#fca5a5;}

  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-top:3px solid var(--navy);min-width:0;}
  .kpi-card.red{border-top-color:var(--red);}
  .kpi-card.green{border-top-color:var(--good);}
  .kpi-card.blue{border-top-color:var(--blue);}
  .kpi-card.amber{border-top-color:#f59e0b;}
  .kpi-card.wide{grid-column:1 / -1;}
  .kpi-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
  .kpi-value{font-size:21px;font-weight:800;margin-top:4px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-value.bad{color:var(--bad);} .kpi-value.good{color:var(--good);}
  .kpi-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .card{background:var(--surface);border-radius:14px;padding:6px 14px;border:1px solid var(--line);box-shadow:var(--shadow);}
  .card + .card{margin-top:10px;}
  .card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 6px;border-bottom:1px solid var(--line);}
  .card-h h3{font-size:15px;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;transition:transform .18s var(--ease);box-shadow:var(--shadow);}
  .row:active{transform:scale(.985);}
  button.row,label.row{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;}
  .row-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .row-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12.5px;color:var(--ink-soft);}
  .row-end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
  .row-amt{font-weight:800;font-size:15px;}
  .badge{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap;}
  .badge.good{background:var(--good-soft);color:var(--good);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.bad{background:var(--bad);color:#fff;}
  .badge.plain{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
  .date-heading{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 8px;}
  .empty{text-align:center;padding:26px 16px;color:var(--ink-faint);background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;}
  .empty h3{font-size:15px;margin-bottom:4px;color:var(--ink-soft);}
  .empty p{font-size:13px;}

  .ms{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .ms:last-child{border-bottom:none;}
  .ms b{font-weight:800;text-align:right;}
  .ms small{display:block;font-size:11px;color:var(--ink-faint);font-weight:600;}
  .ms.total{border-top:2px solid var(--ink);border-bottom:none;margin-top:2px;padding-top:10px;font-size:14.5px;}
  .ms.total + .ms{border-top:1px solid var(--line);}
  .ms.total span{font-weight:800;}
  .ms.hl{background:var(--bad-soft);margin:0 -14px;padding:9px 14px;border-bottom:none;}
  .ms.ok{background:var(--good-soft);margin:0 -14px;padding:9px 14px;border-bottom:none;}
  .good{color:var(--good);} .bad{color:var(--bad);} .muted{color:var(--ink-faint);}
  .link{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:5px 10px;border-radius:7px;flex-shrink:0;}

  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .act{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink);text-align:center;line-height:1.2;box-shadow:var(--shadow);transition:transform .15s var(--ease);}
  .act:active{transform:scale(.95);}
  .act .ic{width:32px;height:32px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;}
  .act.r .ic{background:var(--red-soft);color:var(--red);}
  .act.g .ic{background:var(--good-soft);color:var(--good);}
  .act .ic svg{width:18px;height:18px;}

  .alert{display:flex;gap:10px;align-items:flex-start;background:var(--bad-soft);border:1px solid #f8c4c4;border-left:4px solid var(--bad);color:#7f1d1d;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;}
  .alert b{font-weight:800;}
  .alert.info{background:var(--warn-soft);border-color:#f6d9a6;border-left-color:#f59e0b;color:#78350f;}
  .alert.ok{background:var(--good-soft);border-color:#bfe5cb;border-left-color:var(--good);color:#14532d;}
  .alert .al-go{margin-left:auto;font-weight:800;text-decoration:underline;cursor:pointer;flex-shrink:0;}

  .jeep-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px 12px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;}
  .jeep-card.over{border-color:#f5b5b5;box-shadow:0 0 0 2px rgba(220,38,38,.15),var(--shadow);}
  .jeep-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -14px 4px;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);}
  .jeep-head h3{font-size:16px;}
  .jeep-cols{display:grid;grid-template-columns:1fr;gap:0 18px;}
  .blk-t{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:10px 0 0;}
  .jeep-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;}
  .jeep-btns button{background:var(--navy);color:#fff;border-radius:9px;padding:10px 2px;font-size:12.5px;font-weight:700;}
  .jeep-btns button.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .sub-list{margin-top:6px;border-top:1px dashed var(--line-2);}
  .sub-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
  .sub-row:last-child{border-bottom:none;}
  .sub-row:active{background:var(--surface-2);}
  .sub-row .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sub-row .l small{color:var(--ink-faint);font-weight:600;}
  .sub-row .r{display:flex;align-items:center;gap:6px;flex-shrink:0;font-weight:700;}
  .sub-row.tot{cursor:default;font-weight:800;border-top:2px solid var(--ink);}
  .calc-line{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:13px;display:flex;justify-content:space-between;gap:10px;}
  .calc-line b{font-weight:800;}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{padding:8px 13px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .chip.sm{padding:5px 10px;font-size:12px;}

  .chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);border:1px solid #f6d9a6;white-space:nowrap;}
  .chk.on{background:var(--good-soft);color:var(--good);border-color:#bfe5cb;}

  .hub{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hub button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .15s var(--ease);}
  .hub button:active{transform:scale(.97);}
  .hub .ic{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;}
  .hub .ic svg{width:19px;height:19px;}
  .hub b{font-size:14px;}
  .hub small{font-size:11.5px;color:var(--ink-faint);font-weight:600;line-height:1.3;}

  .tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow);}
  .tbl{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap;}
  .tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;}
  .tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;}
  .tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--navy);font-weight:700;}
  .tbl th:first-child{background:var(--navy);}
  .tbl tr.over td{background:var(--bad-soft);}
  .tbl tr.over td:first-child{background:#fbdada;}
  .tbl tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;background:var(--surface-2);}
  .tbl td.bad{color:var(--bad);font-weight:800;} .tbl td.good{color:var(--good);font-weight:700;}
  .tbl td.act-cell button{font-size:12px;font-weight:700;color:#fff;background:var(--navy);padding:5px 10px;border-radius:7px;}
  .tbl tr[data-worker]{cursor:pointer;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:11px;font-weight:700;font-size:14.5px;width:100%;transition:transform .2s var(--ease);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--navy);color:#fff;box-shadow:0 10px 22px -12px rgba(11,31,58,.6);}
  .btn-red{background:var(--red);color:#fff;}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:var(--bad-soft);color:var(--bad);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  .btn:disabled{opacity:.6;}

  .fab{position:fixed;z-index:45;right:calc((100vw - min(520px,100vw))/2 + 16px);bottom:calc(86px + var(--safe-bottom));width:56px;height:56px;border-radius:16px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 28px -10px rgba(214,32,47,.6);transition:transform .25s var(--ease),opacity .25s var(--ease);}
  .fab:active{transform:scale(.92);}
  .fab svg{width:24px;height:24px;}
  .fab.hidden{opacity:0;pointer-events:none;transform:scale(.6);}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:44;max-width:520px;margin:0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 2px calc(6px + var(--safe-bottom));}
  .side-brand{display:none;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink-faint);border-radius:10px;min-width:0;position:relative;}
  .tab svg{width:21px;height:21px;flex-shrink:0;}
  .tab span{font-size:10.5px;font-weight:700;}
  .tab.active{color:var(--navy);}
  .tab.active::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--red);}
  .tab.desk{display:none;}

  .sheet-overlay{position:fixed;inset:0;background:rgba(11,31,58,0.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);}
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.4);padding:10px 18px calc(24px + var(--safe-bottom));max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .38s var(--ease);}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;border-radius:100px;background:var(--line-2);margin:6px auto 14px;}
  .sheet h2{font-size:19px;margin-bottom:14px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .field input[readonly]{background:var(--surface-2);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;min-width:0;}
  .segmented{display:flex;background:var(--surface-2);border-radius:10px;padding:4px;border:1.5px solid var(--line);}
  .segmented button{flex:1;padding:9px 4px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink-soft);}
  .segmented button.active{background:var(--navy);color:#fff;}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .exp-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .exp-row input{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line-2);outline:none;min-width:0;}
  .exp-row input.n{flex:1.4;} .exp-row input.a{flex:1;}
  .exp-row button{width:34px;height:38px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font-weight:800;flex-shrink:0;}
  .toast{position:fixed;left:50%;bottom:calc(94px + var(--safe-bottom));z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);transition:opacity .25s var(--ease),transform .25s var(--ease);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .banner{background:var(--blue-soft);border:1px solid #c7d6fb;color:#1e3a8a;border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;}
  .banner b{display:block;font-size:13px;margin-bottom:2px;}

  /* ---------- laptop / desktop ---------- */
  @media (min-width: 960px){
    .app{max-width:none;margin:0;padding-left:250px;}
    .topbar{padding-top:14px;}

    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:580px;max-width:92vw;border-radius:16px;max-height:88vh;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .3s var(--ease);padding:14px 26px 26px;}

<script>
(function(){
  'use strict';

  var CHICKEN = '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#0b1f3a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">' +
    '<path d="M26 46 C14 40 10 26 16 16 C20 24 24 26 30 27 C27 20 28 13 33 9 C34 18 37 24 42 30 Z" fill="#1f2937"/>' +
    '<path d="M24 50 C24 34 38 29 52 36 C55 26 60 20 67 20 C75 20 80 26 80 33 C80 44 75 49 73 56 C70 70 59 78 46 78 C32 78 24 66 24 50 Z" fill="#fff7ed"/>' +
    '<path d="M36 52 C44 45 58 47 61 57 C53 64 41 62 36 52 Z" fill="#fde7c7"/><path d="M42 55 C47 55 52 56 55 59" fill="none"/>' +
    '<path d="M62 21 C59 14 64 10 68 15 C69 8 76 8 76 15 C81 12 85 18 79 22 Z" fill="#d6202f"/>' +
    '<path d="M77 38 C78 46 71 48 71 41 Z" fill="#d6202f"/><path d="M80 29 L90 33 L80 37 Z" fill="#f59e0b"/>' +
    '<path d="M42 78 L40 90 M35 91 L40 90 L44 92 M55 77 L57 90 M52 91 L57 90 L61 92" fill="none" stroke="#f59e0b" stroke-width="3"/></g>' +
    '<circle cx="72" cy="28" r="2.6" fill="#0b1f3a"/></svg>';
  document.querySelectorAll('.chicken').forEach(function(el){ el.outerHTML = CHICKEN; });

  /* ================= storage =================
     Guest data lives under DB_KEY. Once signed in, the account's data is
     cached under CLOUD_KEY instead, so signing out returns to guest data. */
  var DB_KEY = 'aryanTradesDB_v1';
  var CLOUD_KEY = 'aryanTradesCloudCache_v1';
  var BACKUP_KEY = 'aryanTradesLastBackup';
  var AUTH_FLAG_KEY = 'aryanTradesAuthUsed';
  var COLLS = ['clients','jeeps','trucks','farmPays','loads','sales','receipts','dead','stock','handovers','expenses','transfers','workers','attendance'];

  function defaultDB(){
    var d = { settings:{ company:'Aryan Traders', allowPct:4.5, dressPct:70, openingCash:0, openingBank:0, openingFridge:0 }, rates:{} };
    COLLS.forEach(function(c){ d[c] = []; });
    return d;
  }
  function normalize(p){
    var d = defaultDB();
    if(p && typeof p === 'object'){
      COLLS.forEach(function(c){ if(Array.isArray(p[c])) d[c] = p[c]; });
      if(p.settings && typeof p.settings === 'object') for(var k in p.settings) d.settings[k] = p.settings[k];
      if(p.rates && typeof p.rates === 'object') d.rates = p.rates;
    }
    return d;
  }
  function authFlag(){ try{ return localStorage.getItem(AUTH_FLAG_KEY)==='1'; }catch(e){ return false; } }
  function storeKey(){ return authFlag() ? CLOUD_KEY : DB_KEY; }
  function load(key){
    try{ var raw = localStorage.getItem(key || storeKey()); return raw ? normalize(JSON.parse(raw)) : defaultDB(); }
    catch(e){ return defaultDB(); }
  }
  var db = load();
  function save(){
    _stock = null;
    try{ localStorage.setItem(storeKey(), JSON.stringify(db)); return true; }
    catch(e){ toast('Save failed — storage full. Download a backup!'); return false; }
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function isEmptyDB(d){ return COLLS.every(function(c){ return !(d[c]||[]).length; }); }

  /* ================= cloud sync (optional account) =================
     Same Firebase project as Dairy Ledger, but everything lives under its own
     root (at_users/{uid}/...), so the two apps never touch each other's data.
     One Firestore document per record — two devices editing different
     records never overwrite each other. */
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyC4mBfQDO5cZXOWX6vNIshmg4NyJxP2yJI",
    authDomain: "dairy-ledger-8d2e4.firebaseapp.com",
    projectId: "dairy-ledger-8d2e4",
    storageBucket: "dairy-ledger-8d2e4.firebasestorage.app",
    messagingSenderId: "557857723065",
    appId: "1:557857723065:web:b42e234a90a8224d31c168"
  };
  var FB_VER = '10.14.1';
  var CLOUD_ROOT = 'at_users';
  var CLOUD_COLLS = COLLS.concat(['rates','meta']);
  var authUser = null, fb = null, fbPromise = null, unsubs = [], pendingOps = [];

  function loadFirebase(){
    if(fbPromise) return fbPromise;
    var base = 'https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    fbPromise = Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]).then(function(m){
      var app = m[0].initializeApp(FIREBASE_CONFIG, 'aryan-trades');
      var fs;
      try{ fs = m[2].initializeFirestore(app, { localCache: m[2].persistentLocalCache({ tabManager: m[2].persistentMultipleTabManager() }) }); }
      catch(e){ fs = m[2].getFirestore(app); }
      fb = { authMod:m[1], fsMod:m[2], auth:m[1].getAuth(app), fs:fs };
      return fb;
    }).catch(function(err){ fbPromise = null; throw err; });
    return fbPromise;
  }
  function cleanRec(r){ return JSON.parse(JSON.stringify(r)); }
  function cloudDoc(coll, id){ return fb.fsMod.doc(fb.fs, CLOUD_ROOT, authUser.uid, coll, id); }
  function cloudPut(coll, rec){
    if(authUser && fb) fb.fsMod.setDoc(cloudDoc(coll, rec.id), cleanRec(rec)).catch(function(){ toast('Could not sync — will retry when online'); });
    else if(authFlag()) pendingOps.push({ op:'put', coll:coll, rec:cleanRec(rec) });
  }
  function cloudDel(coll, id){
    if(authUser && fb) fb.fsMod.deleteDoc(cloudDoc(coll, id)).catch(function(){});
    else if(authFlag()) pendingOps.push({ op:'del', coll:coll, id:id });
  }
  function cloudShape(d){
    var out = {};
    COLLS.forEach(function(c){ out[c] = d[c] || []; });
    out.rates = Object.keys(d.rates||{}).map(function(k){ return { id:k, rate:d.rates[k] }; });
    out.meta = [Object.assign({ id:'settings' }, d.settings)];
    return out;
  }
  function commitChunks(ops){
    var chain = Promise.resolve();
    for(var i=0;i<ops.length;i+=400){
      (function(slice){
        chain = chain.then(function(){
          var b = fb.fsMod.writeBatch(fb.fs);
          slice.forEach(function(o){ if(o.del) b.delete(o.ref); else b.set(o.ref, o.data); });
          return b.commit();
        });
      })(ops.slice(i, i+400));
    }
    return chain;
  }
  function uploadAll(uidStr, d, skipMeta){
    var shaped = cloudShape(d), ops = [];
    CLOUD_COLLS.forEach(function(c){
      if(skipMeta && c==='meta') return;
      shaped[c].forEach(function(r){ ops.push({ ref: fb.fsMod.doc(fb.fs, CLOUD_ROOT, uidStr, c, r.id), data: cleanRec(r) }); });
    });
    return commitChunks(ops);
  }
  function cloudReplaceAll(d){
    if(!authUser || !fb) return;
    Promise.all(CLOUD_COLLS.map(function(c){ return fb.fsMod.getDocs(fb.fsMod.collection(fb.fs, CLOUD_ROOT, authUser.uid, c)); })).then(function(snaps){
      var ops = [];
      snaps.forEach(function(s){ s.forEach(function(docSnap){ ops.push({ del:true, ref:docSnap.ref }); }); });
      return commitChunks(ops);
    }).then(function(){ return uploadAll(authUser.uid, d); }).catch(function(){ toast('Could not sync the restore — try again online'); });
  }
  function cloudIsEmpty(uidStr){
    return Promise.all(CLOUD_COLLS.map(function(c){ return fb.fsMod.getDocs(fb.fsMod.collection(fb.fs, CLOUD_ROOT, uidStr, c)); }))
      .then(function(snaps){ return snaps.every(function(s){ return s.empty; }); });
  }
  function detach(){ unsubs.forEach(function(u){ u(); }); unsubs = []; }
  function attach(uidStr){
    detach();
    CLOUD_COLLS.forEach(function(c){
      var ref = fb.fsMod.collection(fb.fs, CLOUD_ROOT, uidStr, c);
      unsubs.push(fb.fsMod.onSnapshot(ref, function(snap){
        var docs = snap.docs.map(function(x){ return x.data(); });
        if(c==='rates'){ db.rates = {}; docs.forEach(function(r){ db.rates[r.id] = r.rate; }); }
        else if(c==='meta'){
          var s = docs.find(function(x){ return x.id==='settings'; });
          if(s){ var ns = defaultDB().settings; for(var k in s) if(k!=='id') ns[k] = s[k]; db.settings = ns; }
        } else db[c] = docs;
        save(); render();
      }, function(){ toast('Sync error — check your connection'); }));
    });
  }
  function flushPending(){
    var ops = pendingOps; pendingOps = [];
    ops.forEach(function(o){ if(o.op==='put') cloudPut(o.coll, o.rec); else cloudDel(o.coll, o.id); });
  }
  function friendlyAuthError(err){
    var map = {
      'auth/email-already-in-use':'That email already has an account — use Log In instead.',
      'auth/invalid-email':'That doesn\'t look like a valid email.',
      'auth/weak-password':'Password should be at least 6 characters.',
      'auth/wrong-password':'Wrong password.', 'auth/invalid-credential':'Wrong email or password.',
      'auth/user-not-found':'No account with that email.',
      'auth/network-request-failed':'No internet — try again once online.',
      'auth/too-many-requests':'Too many attempts. Wait a bit and try again.'
    };
    return (err && map[err.code]) || (err && !err.code && err.message) || 'Something went wrong. Please try again.';
  }
  function finishSignIn(user, msg){
    authUser = user;
    try{ localStorage.setItem(AUTH_FLAG_KEY, '1'); }catch(e){}
    db = load(CLOUD_KEY);
    attach(user.uid);
    closeSheet(); toast(msg || ('Signed in as '+user.email)); render();
  }
  function performSignIn(isSignUp, email, pass){
    var guest = db;
    return loadFirebase().then(function(x){
      return (isSignUp ? x.authMod.createUserWithEmailAndPassword : x.authMod.signInWithEmailAndPassword)(x.auth, email, pass);
    }).then(function(cred){
      var user = cred.user;
      return cloudIsEmpty(user.uid).then(function(empty){
        if(isEmptyDB(guest)) return finishSignIn(user);
        if(empty) return uploadAll(user.uid, guest).then(function(){ finishSignIn(user, 'Signed in — your data is now in your account'); });
        askMerge(user, guest);
      });
    }).catch(function(err){ toast(friendlyAuthError(err)); });
  }
  function askMerge(user, guest){
    openSheet('<h2>Data on this device</h2><p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;">Your account already has data, and this device also has entries that aren\'t in the account yet.</p>' +
      '<button class="btn btn-primary" id="mgMerge" style="margin-bottom:10px;">Add this device\'s entries to the account</button>' +
      '<button class="btn btn-ghost" id="mgKeep">Use account data only</button>',
      function(root){
        f(root,'mgMerge').onclick = function(){
          this.disabled = true;
          uploadAll(user.uid, guest, true).then(function(){ finishSignIn(user, 'Merged into your account'); })
            .catch(function(){ toast('Could not upload — try again online'); });
        };
        f(root,'mgKeep').onclick = function(){ finishSignIn(user); };
      });
  }
  function performSignOut(){
    if(!fb) return;
    fb.authMod.signOut(fb.auth).then(function(){
      authUser = null; detach();
      try{ localStorage.removeItem(AUTH_FLAG_KEY); }catch(e){}
      db = load(DB_KEY); toast('Signed out'); render();
    });
  }
  function restoreSession(){
    if(!authFlag()) return;
    loadFirebase().then(function(x){
      var un = x.authMod.onAuthStateChanged(x.auth, function(user){
        un();
        if(user){ authUser = user; flushPending(); attach(user.uid); render(); }
        else { try{ localStorage.removeItem(AUTH_FLAG_KEY); }catch(e){} db = load(DB_KEY); render(); }
      });
    }).catch(function(){ /* offline and SDK not cached yet: keep showing the cached copy */ });
  }
  function openAuthSheet(mode){
    var html = '<h2>Account</h2>' + segmented('auMode', [['login','Log In'],['signup','Create account']], mode) +
      '<div class="field" style="margin-top:14px;"><label>Email</label><input type="email" id="auEmail" autocomplete="email"></div>' +
      '<div class="field"><label>Password</label><input type="password" id="auPass" autocomplete="current-password"></div>' +
      '<div class="field" id="auConfWrap" style="display:'+(mode==='signup'?'':'none')+'"><label>Confirm password</label><input type="password" id="auConf" autocomplete="new-password"></div>' +
      '<button class="btn btn-primary" id="auGo">'+(mode==='signup'?'Create account':'Log In')+'</button>' +
      '<button class="btn btn-ghost" id="auForgot" style="margin-top:10px;">Forgot password?</button>' +
      '<p class="hint" style="margin-top:12px;">Use the same email &amp; password on your phone and laptop to see the same data on both.</p>';
    openSheet(html, function(root){
      var m = wireSeg(root, 'auMode', function(v){ f(root,'auConfWrap').style.display = v==='signup' ? '' : 'none'; f(root,'auGo').textContent = v==='signup' ? 'Create account' : 'Log In'; });
      f(root,'auGo').onclick = function(){
        var btn = this, email = f(root,'auEmail').value.trim(), pass = f(root,'auPass').value;
        if(!email || !pass){ toast('Enter email and password'); return; }
        if(m()==='signup' && pass !== f(root,'auConf').value){ toast('Passwords don\'t match'); return; }
        btn.disabled = true; btn.textContent = 'Please wait…';
        performSignIn(m()==='signup', email, pass).then(function(){ btn.disabled = false; btn.textContent = m()==='signup' ? 'Create account' : 'Log In'; });
      };
      f(root,'auForgot').onclick = function(){
        var email = f(root,'auEmail').value.trim();
        if(!email){ toast('Type your email above first'); return; }
        loadFirebase().then(function(x){ return x.authMod.sendPasswordResetEmail(x.auth, email); })
          .then(function(){ toast('Reset link sent — check your email'); }, function(err){ toast(friendlyAuthError(err)); });
      };
    });
  }

  /* ================= formatting ================= */
  function todayISO(){ var d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  function addDays(iso, n){ var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2]+n)).toISOString().slice(0,10); }
  function addMonths(iso, n){ var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1]-1+n, 1)).toISOString().slice(0,10); }
  function daysInMonth(iso){ var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate(); }
  function monthEnd(ym){ return ym + '-' + String(daysInMonth(ym+'-01')).padStart(2,'0'); }
  function r2(n){ return Math.round((Number(n)||0)*100)/100; }
  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function money(n){
    n = r2(n); var neg = n < 0; n = Math.abs(n);
    return (neg?'-':'') + '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:2, minimumFractionDigits:(n%1===0?0:2)});
  }
  function kg(n){ return r2(n).toLocaleString('en-IN', {maximumFractionDigits:2}) + ' kg'; }
  function kgN(n){ return r2(n).toLocaleString('en-IN', {maximumFractionDigits:2}); }
  function birds(n){ n = Math.round(Number(n)||0); return n.toLocaleString('en-IN') + ' bird' + (n===1?'':'s'); }
  function pctOf(part, whole){ return whole > 0 ? Math.round(part/whole*1000)/10 : 0; }
  function pct(part, whole){ return whole > 0 ? pctOf(part, whole) + '%' : '—'; }
  function dateLabel(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', {weekday:'short', day:'2-digit', month:'short', year:'numeric'}); }
  function dateShort(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', {day:'2-digit', month:'short'}); }
  function chipLabel(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', {weekday:'short', day:'2-digit', month:'short'}); }
  function monthLabel(ym){ var p = ym.split('-'); return new Date(+p[0], +p[1]-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sum(list, fn){ return list.reduce(function(s,x){ return s + (Number(typeof fn==='function' ? fn(x) : x[fn])||0); }, 0); }
  function byDateDesc(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); }
  function byDateAsc(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); }
  function inMonth(ym){ return function(x){ return !!x.date && x.date.slice(0,7)===ym; }; }
  function onDate(d){ return function(x){ return x.date===d; }; }

  var EXP_CATS = [
    ['diesel','Diesel / fuel'], ['repair','Jeep repair'], ['driver','Driver salary'], ['helper','Helper salary'],
    ['food','Food (staff)'], ['farmwage','Farm staff wages'], ['labour','Labour (other)'], ['farm','Farm running'], ['house','House expense'], ['other','Other']
  ];
  function catLabel(k){ var c = EXP_CATS.find(function(x){ return x[0]===k; }); return c ? c[1] : 'Other'; }
  var ROLES = [['driver','Driver'],['helper','Helper'],['farm','Farm staff'],['labour','Labour'],['other','Other']];
  var ROLE_CAT = { driver:'driver', helper:'helper', farm:'farmwage', labour:'labour', other:'other' };
  function roleLabel(k){ var r = ROLES.find(function(x){ return x[0]===k; }); return r ? r[1] : 'Other'; }
  var TRUCK_EXP_PRESETS = ['Truck freight (bhada)', 'Loading labour', 'Unloading labour', 'Toll / naka', 'Truck driver kharcha', 'Diesel', 'Other'];

  /* ================= lookups ================= */
  function company(){ var c = db.settings.company; return !c || c==='Aryan Trades' ? 'Aryan Traders' : c; }
  function clientById(id){ return db.clients.find(function(c){ return c.id===id; }); }
  function jeepById(id){ return db.jeeps.find(function(j){ return j.id===id; }); }
  function workerById(id){ return db.workers.find(function(w){ return w.id===id; }); }
  function jeepName(id){ var j = jeepById(id); return j ? j.name + (j.driver ? ' · '+j.driver : '') : ''; }
  function farmNames(){
    var s = {}; db.trucks.forEach(function(t){ if(t.farm) s[t.farm] = 1; }); db.farmPays.forEach(function(p){ if(p.farm) s[p.farm] = 1; });
    return Object.keys(s).sort();
  }
  function allowPct(){ var p = db.settings.allowPct; return p==null || p==='' ? 4.5 : num(p); }
  function dressPct(){ var p = db.settings.dressPct; return p==null || p==='' ? 70 : num(p); }
  function isDressed(s){ return s.kind==='dressed'; }
  function jeepSalesAll(){ return db.sales.filter(function(s){ return !isDressed(s); }); }
  function dressSalesAll(){ return db.sales.filter(isDressed); }
  function shopNames(){ var s = {}; dressSalesAll().forEach(function(x){ if(x.shop) s[x.shop] = 1; }); return Object.keys(s).sort(); }

  /* ================= trucks =================
     Truck expenses are a free list (freight, labour, toll…), all paid in cash.
     Older entries stored freight/labour as two fields — read those as a list too. */
  function truckExps(t){
    if(Array.isArray(t.exps)) return t.exps.filter(function(x){ return num(x.a) > 0; });
    var o = [];
    if(num(t.freight)) o.push({ n:'Truck freight (bhada)', a:num(t.freight) });
    if(num(t.labour)) o.push({ n:'Loading/unloading labour', a:num(t.labour) });
    return o;
  }
  function truckExpTotal(t){ return r2(sum(truckExps(t), 'a')); }
  function truckDead(t){ return db.dead.find(function(x){ return x.id==='dt_'+t.id; }); }

  /* ================= dead birds → dressing → fridge =================
     Every dead entry says where it came from: the truck on arrival, the farm
     stock, or a jeep that brought it back. Its weight is taken off that
     source automatically; the dressed kg (after skin & organs) goes into the
     farm fridge. */
  function deadSrc(x){ return x.src || 'farm'; }
  function srcLabel(s){
    if(s==='truck') return 'Truck (on arrival)';
    if(s==='farm') return 'Farm stock';
    var j = jeepById(s); return j ? j.name+' (came back)' : 'Jeep';
  }
  function dressedKg(x){ return x.dressedKg!=null && x.dressedKg!=='' ? num(x.dressedKg) : r2(num(x.kg)*dressPct()/100); }
  function fridgeDay(d){
    var before = function(x){ return x.date < d; }, on = onDate(d), ds = dressSalesAll();
    var open = num(db.settings.openingFridge) + sum(db.dead.filter(before), dressedKg) - sum(ds.filter(before), 'kg');
    var dIn = db.dead.filter(on), sold = ds.filter(on);
    var o = { open:r2(open), dead:dIn, sales:sold, deadK:r2(sum(dIn,'kg')), deadB:sum(dIn,'birds'), inK:r2(sum(dIn, dressedKg)), soldK:r2(sum(sold,'kg')), amt:r2(sum(sold,'amount')) };
    o.close = r2(o.open + o.inK - o.soldK);
    return o;
  }

  /* ================= farm stock (weight) =================
     Left at farm = left from before + truck in − dead in truck
                    − loaded into jeeps + returned alive − died at farm.
     Whatever is left carries over to the next day automatically. A weighed
     count that day (optional) replaces the figure; the gap is farm loss. */
  var _stock = null;
  function computeDay(d, open){
    var on = onDate(d);
    var tr = db.trucks.filter(on), ld = db.loads.filter(on), dd = db.dead.filter(on);
    var loads = ld.filter(function(x){ return x.type!=='return'; }), rets = ld.filter(function(x){ return x.type==='return'; });
    var td = dd.filter(function(x){ return deadSrc(x)==='truck'; }), fd = dd.filter(function(x){ return deadSrc(x)==='farm'; });
    var o = {
      open: open,
      inB: sum(tr,'birds'), inK: r2(sum(tr,'kg')),
      tdB: sum(td,'birds'), tdK: r2(sum(td,'kg')),
      loadB: sum(loads,'birds'), loadK: r2(sum(loads,'kg')),
      retB: sum(rets,'birds'), retK: r2(sum(rets,'kg')),
      fdB: sum(fd,'birds'), fdK: r2(sum(fd,'kg'))
    };
    o.availB = open.birds + o.inB - o.tdB; o.availK = r2(open.kg + o.inK - o.tdK);
    o.exp = { birds: o.availB - o.loadB + o.retB - o.fdB, kg: r2(o.availK - o.loadK + o.retK - o.fdK) };
    o.birdsKnown = ld.concat(td, fd).every(function(x){ return num(x.birds) > 0 || !(num(x.kg) > 0); }) && open.birds >= 0;
    if(!o.birdsKnown){ o.exp.birds = 0; }
    var cnt = db.stock.find(function(x){ return x.date===d; });
    o.counted = cnt || null;
    o.close = cnt ? { birds: num(cnt.birds), kg: num(cnt.kg) } : o.exp;
    o.lossK = cnt ? r2(o.exp.kg - o.close.kg) : 0;
    return o;
  }
  function stockSeries(){
    if(_stock) return _stock;
    var set = {};
    ['trucks','loads','dead','stock'].forEach(function(c){ db[c].forEach(function(x){ if(x.date) set[x.date] = 1; }); });
    var dates = Object.keys(set).sort(), out = {}, cur = { birds:0, kg:0 };
    dates.forEach(function(d){ var o = computeDay(d, cur); out[d] = o; cur = { birds:o.close.birds, kg:o.close.kg }; });
    _stock = { dates:dates, byDate:out };
    return _stock;
  }
  function stockBefore(d){
    var s = stockSeries();
    for(var i=s.dates.length-1;i>=0;i--) if(s.dates[i] < d) return s.byDate[s.dates[i]].close;
    return { birds:0, kg:0 };
  }
  function stockOn(d){ var s = stockSeries(); return s.byDate[d] || computeDay(d, stockBefore(d)); }

  /* ================= jeep account =================
     No clients: the driver owes the day's sale. Whatever he doesn't hand
     over (cash + GPay) after his road expenses stays as his udhar balance
     and rolls into the next day.
     Weight: loaded − returned alive − dead brought back = kg he had to sell.
     An allowed weight loss (default 4.5% of what was loaded) is expected;
     anything above is flagged red. */
  function jeepMoney(jid, pred){
    var amt = 0, recv = 0, exp = 0;
    db.sales.forEach(function(s){ if(s.jeepId===jid && !isDressed(s) && pred(s)){ amt += num(s.amount); recv += num(s.online); } });
    db.handovers.forEach(function(h){ if(h.jeepId===jid && pred(h)) recv += num(h.amount); });
    db.expenses.forEach(function(e){ if(e.jeepId===jid && e.mode==='driver' && pred(e)) exp += num(e.amount); });
    db.receipts.forEach(function(r){ if(!r.jeepId && pred(r)){ var c = clientById(r.clientId); if(c && c.jeepId===jid) recv += num(r.amount); } });
    return r2(amt - recv - exp);
  }
  function jeepOpen(jid, d){ var j = jeepById(jid); return r2(num(j && j.openingDue) + jeepMoney(jid, function(x){ return x.date < d; })); }
  function jeepBalanceNow(jid, d){ var j = jeepById(jid); return r2(num(j && j.openingDue) + jeepMoney(jid, function(x){ return x.date <= d; })); }
  function jeepDay(jid, d){
    function mine(x){ return x.date===d && x.jeepId===jid; }
    var ld = db.loads.filter(mine);
    var loads = ld.filter(function(x){ return x.type!=='return'; }), rets = ld.filter(function(x){ return x.type==='return'; });
    var sales = db.sales.filter(function(s){ return mine(s) && !isDressed(s); });
    var dead = db.dead.filter(function(x){ return x.date===d && x.src===jid; });
    var hv = db.handovers.filter(mine);
    var ex = db.expenses.filter(function(e){ return mine(e) && e.mode==='driver'; });
    var rc = db.receipts.filter(function(r){ if(r.date!==d || r.jeepId) return false; var c = clientById(r.clientId); return !!(c && c.jeepId===jid); });
    var o = {
      ld:ld, sales:sales, dead:dead, hv:hv, ex:ex,
      loadK: r2(sum(loads,'kg')), loadB: sum(loads,'birds'), retK: r2(sum(rets,'kg')), deadK: r2(sum(dead,'kg')), deadB: sum(dead,'birds'),
      soldK: r2(sum(sales,'kg')), amt: r2(sum(sales,'amount')),
      cashIn: r2(sum(hv, function(h){ return num(h.amount) - num(h.gpay); }) + sum(rc, 'amount')),
      gpayIn: r2(sum(hv,'gpay') + sum(sales,'online')),
      exp: r2(sum(ex,'amount'))
    };
    o.recv = r2(o.cashIn + o.gpayIn);
    o.netK = r2(o.loadK - o.retK - o.deadK);
    o.allowK = r2(o.loadK * allowPct() / 100);
    o.idealK = r2(o.netK - o.allowK);
    o.lossK = r2(o.netK - o.soldK);
    o.lossPct = pctOf(o.lossK, o.loadK);
    o.extraK = r2(o.lossK - o.allowK);
    o.over = o.loadK > 0 && o.soldK > 0 && o.extraK > 0.004;
    o.rate = o.soldK > 0 ? o.amt / o.soldK : num(db.rates[d]);
    o.extraVal = r2(Math.max(0, o.extraK) * o.rate);
    o.open = jeepOpen(jid, d);
    o.close = r2(o.open + o.amt - o.recv - o.exp);
    o.active = !!(ld.length || sales.length || hv.length || ex.length || dead.length || rc.length);
    return o;
  }

  /* ================= cash & bank =================
     GPay collected by drivers or from dressed sales lands straight in the
     bank. Every GPay amount can be ticked once it is seen in the bank
     statement; unticked ones are what still needs checking. */
  function flows(pred){
    var o = { jeepCash:0, jeepGpay:0, dressCash:0, dressGpay:0, otherCash:0, otherBank:0, farmCash:0, farmBank:0, truckExp:0, expCash:0, expBank:0, dep:0, wd:0 };
    db.handovers.forEach(function(h){ if(!pred(h)) return; var g = num(h.gpay); o.jeepGpay += g; o.jeepCash += num(h.amount) - g; });
    db.sales.forEach(function(s){
      if(!pred(s)) return;
      if(isDressed(s)){ if(s.mode==='gpay') o.dressGpay += num(s.amount); else o.dressCash += num(s.amount); }
      else o.jeepGpay += num(s.online);
    });
    db.receipts.forEach(function(r){ if(!pred(r)) return; if(r.mode==='online') o.otherBank += num(r.amount); else o.otherCash += num(r.amount); });
    db.trucks.forEach(function(t){ if(!pred(t)) return; if(t.payMode==='bank') o.farmBank += num(t.paid); else o.farmCash += num(t.paid); o.truckExp += truckExpTotal(t); });
    db.farmPays.forEach(function(p){ if(!pred(p)) return; if(p.mode==='bank') o.farmBank += num(p.amount); else o.farmCash += num(p.amount); });
    db.expenses.forEach(function(e){ if(!pred(e)) return; if(e.mode==='bank') o.expBank += num(e.amount); else if(e.mode==='cash') o.expCash += num(e.amount); });
    db.transfers.forEach(function(t){ if(!pred(t)) return; if(t.dir==='c2b') o.dep += num(t.amount); else o.wd += num(t.amount); });
    for(var k in o) o[k] = r2(o[k]);
    o.cashIn = r2(o.jeepCash + o.dressCash + o.otherCash + o.wd);
    o.cashOut = r2(o.farmCash + o.truckExp + o.expCash + o.dep);
    o.bankIn = r2(o.jeepGpay + o.dressGpay + o.otherBank + o.dep);
    o.bankOut = r2(o.farmBank + o.expBank + o.wd);
    return o;
  }
  function balances(d){
    var f0 = flows(function(x){ return x.date <= d; });
    return { cash: r2(num(db.settings.openingCash) + f0.cashIn - f0.cashOut), bank: r2(num(db.settings.openingBank) + f0.bankIn - f0.bankOut) };
  }
  function gpayItems(pred){
    var out = [];
    db.handovers.forEach(function(h){ if(num(h.gpay) > 0 && pred(h)){ var j = jeepById(h.jeepId); out.push({ coll:'handovers', rec:h, date:h.date, amt:num(h.gpay), label:(j?j.name:'Jeep')+(j&&j.driver?' · '+j.driver:''), sub:'Driver collection' }); } });
    dressSalesAll().forEach(function(s){ if(s.mode==='gpay' && pred(s)) out.push({ coll:'sales', rec:s, date:s.date, amt:num(s.amount), label:s.shop||'Shop', sub:'Dressed chicken' }); });
    return out.sort(function(a,b){ return byDateDesc(a,b) || b.amt - a.amt; });
  }
  function gpayPending(){ return gpayItems(function(){ return true; }).filter(function(g){ return !g.rec.gpayOk; }); }
  function farmBalances(){
    var m = {};
    db.trucks.forEach(function(t){ var k = t.farm||'Unknown farm'; m[k] = (m[k]||0) + num(t.amount) - num(t.paid); });
    db.farmPays.forEach(function(p){ var k = p.farm||'Unknown farm'; m[k] = (m[k]||0) - num(p.amount); });
    return Object.keys(m).map(function(k){ return { farm:k, due:r2(m[k]) }; }).filter(function(x){ return Math.abs(x.due) > 0.004; })
      .sort(function(a,b){ return b.due - a.due; });
  }

  /* ================= staff salary =================
     No attendance: a monthly worker earns salary ÷ days-in-month for every
     day since he started. Salary & advances paid are stored as expenses
     (with workerId) so they flow into cash/bank and profit. */
  function workerPays(wid){ return db.expenses.filter(function(e){ return e.workerId===wid; }); }
  function workerEarned(w, from, to){
    var start = w.start && w.start > from ? w.start : from, t = todayISO(), end = to > t ? t : to, e = 0;
    for(var d = start; d <= end; d = addDays(d, 1)) e += w.payType==='daily' ? num(w.wage) : num(w.salary) / daysInMonth(d);
    return r2(e);
  }
  function workerPaidAll(w){ return r2(sum(workerPays(w.id), 'amount')); }
  function workerBalance(w){ return r2(workerEarned(w, w.start || todayISO(), todayISO()) + num(w.openingDue) - workerPaidAll(w)); }
  function workerMonth(w, ym){
    var pays = workerPays(w.id).filter(inMonth(ym));
    return {
      earned: workerEarned(w, ym+'-01', monthEnd(ym)),
      paidSalary: r2(sum(pays.filter(function(e){ return e.kind!=='advance'; }),'amount')),
      paidAdvance: r2(sum(pays.filter(function(e){ return e.kind==='advance'; }),'amount'))
    };
  }
  function rateLabel(w){ return w.payType==='daily' ? money(w.wage)+'/day' : money(w.salary)+'/month'; }

  /* ================= reports ================= */
  function monthReport(ym){
    var M = inMonth(ym);
    var tr = db.trucks.filter(M), js = jeepSalesAll().filter(M), ds = dressSalesAll().filter(M), ex = db.expenses.filter(M);
    var ld = db.loads.filter(M), dd = db.dead.filter(M);
    var r = {
      trucks: tr.length, buyK: r2(sum(tr,'kg')), buyAmt: r2(sum(tr,'amount')), truckExp: r2(sum(tr, truckExpTotal)),
      sellK: r2(sum(js,'kg')), sellAmt: r2(sum(js,'amount')),
      dressK: r2(sum(ds,'kg')), dressAmt: r2(sum(ds,'amount')),
      deadK: r2(sum(dd,'kg')), deadB: sum(dd,'birds'), dressedIn: r2(sum(dd, dressedKg)),
      loadK: r2(sum(ld.filter(function(x){ return x.type!=='return'; }),'kg')), retK: r2(sum(ld.filter(function(x){ return x.type==='return'; }),'kg')),
      jeepDeadK: r2(sum(dd.filter(function(x){ return jeepById(x.src); }),'kg'))
    };
    r.avgBuy = r.buyK > 0 ? r.buyAmt / r.buyK : 0;
    r.avgSell = r.sellK > 0 ? r.sellAmt / r.sellK : 0;
    r.jeepLossK = r2(r.loadK - r.retK - r.jeepDeadK - r.sellK);
    r.allowK = r2(r.loadK * allowPct() / 100);
    r.jeepLossPct = pctOf(r.jeepLossK, r.loadK);
    r.over = r.sellK > 0 && r.jeepLossK > r.allowK + 0.004;
    var lastTruck = db.trucks.filter(function(t){ return t.date.slice(0,7) <= ym; }).sort(byDateDesc)[0];
    var valRate = r.avgBuy || (lastTruck ? num(lastTruck.rate) : 0);
    var first = ym + '-01';
    r.openStock = stockBefore(first); r.closeStock = stockBefore(addMonths(first, 1));
    r.stockChange = r2((r.closeStock.kg - r.openStock.kg) * valRate);
    var s = stockSeries();
    r.farmLossK = r2(s.dates.filter(function(d){ return d.slice(0,7)===ym; }).reduce(function(t,d){ return t + s.byDate[d].lossK; }, 0));
    r.cats = EXP_CATS.map(function(c){ return { key:c[0], label:c[1], amt: r2(sum(ex.filter(function(e){ return e.cat===c[0]; }),'amount')) }; })
      .filter(function(c){ return c.amt; });
    r.house = r2(sum(ex.filter(function(e){ return e.cat==='house'; }),'amount'));
    r.business = r2(sum(ex,'amount') - r.house);
    r.gross = r2(r.sellAmt + r.dressAmt - r.buyAmt + r.stockChange);
    r.profit = r2(r.gross - r.truckExp - r.business);
    r.net = r2(r.profit - r.house);
    return r;
  }
  function monthDates(ym){
    var out = [], end = monthEnd(ym), t = todayISO();
    if(end > t) end = t;
    for(var d = ym+'-01'; d <= end; d = addDays(d,1)) out.push(d);
    return out;
  }
  function activeDates(ym){
    var set = {};
    ['trucks','loads','sales','expenses','dead','stock','handovers','receipts','transfers','farmPays'].forEach(function(c){ db[c].forEach(function(x){ if(x.date && x.date.slice(0,7)===ym) set[x.date] = 1; }); });
    return Object.keys(set).sort();
  }
  function dailyRows(ym){
    return activeDates(ym).map(function(d){
      var st = stockOn(d), fr = fridgeDay(d), jd = db.jeeps.map(function(j){ return jeepDay(j.id, d); });
      var o = { date:d, inK:st.inK, loadK:r2(sum(jd,'loadK')), retK:r2(sum(jd,'retK')), deadK:r2(st.tdK + st.fdK + sum(jd,'deadK')),
        soldK:r2(sum(jd,'soldK')), lossK:r2(sum(jd,'lossK')), allowK:r2(sum(jd,'allowK')), left:st.close.kg,
        sales:r2(sum(jd,'amt') + fr.amt), recv:r2(sum(jd,'recv') + fr.amt),
        exp:r2(sum(db.expenses.filter(onDate(d)),'amount') + sum(db.trucks.filter(onDate(d)), truckExpTotal)) };
      o.lossPct = pctOf(o.lossK, o.loadK);
      o.over = jd.some(function(x){ return x.over; });
      return o;
    });
  }
  function jeepRows(ym){
    var dates = monthDates(ym), lastDay = dates.length ? dates[dates.length-1] : monthEnd(ym);
    return db.jeeps.map(function(j){
      var t = { j:j, loadK:0, retK:0, deadK:0, soldK:0, lossK:0, allowK:0, amt:0, cashIn:0, gpayIn:0, exp:0, overDays:0 };
      dates.forEach(function(d){
        var o = jeepDay(j.id, d);
        ['loadK','retK','deadK','soldK','lossK','allowK','amt','cashIn','gpayIn','exp'].forEach(function(k){ t[k] += o[k]; });
        if(o.over) t.overDays++;
      });
      for(var k in t) if(typeof t[k]==='number') t[k] = r2(t[k]);
      t.lossPct = pctOf(t.lossK, t.loadK);
      t.over = t.soldK > 0 && t.lossK > t.allowK + 0.004;
      t.bal = jeepBalanceNow(j.id, lastDay);
      return t;
    });
  }
  function farmRows(ym){
    var M = inMonth(ym), bal = {};
    farmBalances().forEach(function(x){ bal[x.farm] = x.due; });
    var names = {}; db.trucks.filter(M).forEach(function(t){ names[t.farm||'Unknown farm'] = 1; }); db.farmPays.filter(M).forEach(function(p){ names[p.farm||'Unknown farm'] = 1; });
    return Object.keys(names).sort().map(function(n){
      var tr = db.trucks.filter(function(t){ return M(t) && (t.farm||'Unknown farm')===n; });
      var fp = db.farmPays.filter(function(p){ return M(p) && (p.farm||'Unknown farm')===n; });
      var k = sum(tr,'kg'), a = sum(tr,'amount');
      return { farm:n, trucks:tr.length, kg:r2(k), amt:r2(a), avg: k>0 ? r2(a/k) : 0, paid:r2(sum(tr,'paid') + sum(fp,'amount')), bal: bal[n]||0 };
    });
  }
  function salaryRows(ym){
    return db.workers.map(function(w){ return { w:w, m:workerMonth(w, ym), all:workerPaidAll(w), bal:workerBalance(w) }; });
  }

  /* ================= dom / ui helpers ================= */
  var $view = document.getElementById('view');
  var $title = document.getElementById('pageTitle');
  var $sub = document.getElementById('pageSub');

  var toastTimer;
  function toast(msg){
    $toast.textContent = msg; $toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ $toast.classList.remove('show'); }, 2600);
  }
  function openSheet(html, onMount){
    $sheetContent.innerHTML = html;
    $sheet.scrollTop = 0;
    $sheet.classList.add('open'); $overlay.classList.add('open');
    if(onMount) onMount($sheetContent);
  }
  function closeSheet(){ $sheet.classList.remove('open'); $overlay.classList.remove('open'); }
  $overlay.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
  function confirmThen(title, msg, okLabel, fn){
    openSheet('<h2>'+esc(title)+'</h2><p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;">'+esc(msg)+'</p>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="cfNo">Cancel</button><button class="btn btn-danger" id="cfYes">'+esc(okLabel||'Delete')+'</button></div>',
      function(root){ f(root,'cfNo').onclick = closeSheet; f(root,'cfYes').onclick = function(){ fn(); closeSheet(); }; });
  }
  function upsert(coll, rec){
    var i = db[coll].findIndex(function(x){ return x.id===rec.id; });
    if(i < 0) db[coll].push(rec); else db[coll][i] = rec;
    save(); cloudPut(coll, rec);
  }
  function removeNow(coll, id){
    db[coll] = db[coll].filter(function(x){ return x.id!==id; });
    save(); cloudDel(coll, id);
  }
  function removeRec(coll, id, label, after){
    confirmThen('Delete '+(label||'entry')+'?', 'This will be permanently removed.', 'Delete', function(){ removeNow(coll, id); if(after) after(); toast('Deleted'); render(); });
  }
  function setRate(d, v){
    if(v > 0){ db.rates[d] = v; save(); cloudPut('rates', { id:d, rate:v }); }
    else { delete db.rates[d]; save(); cloudDel('rates', d); }
  }
  function saveSettings(){ save(); cloudPut('meta', Object.assign({ id:'settings' }, db.settings)); }
  function segmented(id, opts, cur){
    return '<div class="segmented" id="'+id+'">' + opts.map(function(o){
      return '<button type="button" data-v="'+o[0]+'"'+(o[0]===cur?' class="active"':'')+'>'+esc(o[1])+'</button>';
    }).join('') + '</div>';
  }
  function wireSeg(root, id, onChange){
    var wrap = root.querySelector('#'+id);
    var a = wrap.querySelector('.active'), val = a ? a.getAttribute('data-v') : null;
    wrap.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        wrap.querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active'); val = b.getAttribute('data-v'); if(onChange) onChange(val);
      });
    });
    return function(){ return val; };
  }
  function jeepOptions(sel, noneLabel){
    return (noneLabel ? '<option value="">'+esc(noneLabel)+'</option>' : '') + db.jeeps.map(function(j){
      return '<option value="'+j.id+'"'+(j.id===sel?' selected':'')+'>'+esc(j.name)+(j.driver?' · '+esc(j.driver):'')+'</option>';
    }).join('');
  }
  function f(root, id){ return root.querySelector('#'+id); }
  function emptyState(t, s){ return '<div class="empty"><h3>'+esc(t)+'</h3><p>'+esc(s)+'</p></div>'; }
  function dateNav(){
    var isToday = state.date === todayISO();
    return '<div class="date-nav"><button data-dnav="-1" aria-label="Previous day">‹</button>' +
      '<div class="dn-label">'+esc(dateLabel(state.date))+(isToday?'<span class="dn-sub">Today</span>':'<span class="dn-sub" data-dtoday style="cursor:pointer">Go to today ›</span>')+'</div>' +
      '<button data-dnav="1" aria-label="Next day">›</button></div>';
  }
  function monthNav(){
    return '<div class="date-nav"><button data-mnav="-1" aria-label="Previous month">‹</button>' +
      '<div class="dn-label">'+esc(monthLabel(state.date.slice(0,7)))+'</div>' +
      '<button data-mnav="1" aria-label="Next month">›</button></div>';
  }
  function wireNav(){
    $view.querySelectorAll('[data-dnav]').forEach(function(b){ b.onclick = function(){ setDate(addDays(state.date, +b.getAttribute('data-dnav'))); }; });
    $view.querySelectorAll('[data-mnav]').forEach(function(b){ b.onclick = function(){ setDate(addMonths(state.date, +b.getAttribute('data-mnav'))); }; });
    $view.querySelectorAll('[data-dtoday]').forEach(function(b){ b.onclick = function(){ setDate(todayISO()); }; });
    $view.querySelectorAll('[data-back]').forEach(function(b){ b.onclick = function(){ state.sub = null; switchTab('more'); }; });
    $view.querySelectorAll('[data-goto]').forEach(function(b){ b.onclick = function(){ switchTab(b.getAttribute('data-goto')); }; });
  }

  function act(k, icon, label, cls){ return '<button class="act '+(cls||'')+'" data-act="'+k+'"><span class="ic">'+ICONS[icon]+'</span>'+label+'</button>'; }
  function ms(label, val, cls){ return '<div class="ms '+(cls||'')+'"><span>'+label+'</span><b class="num">'+val+'</b></div>'; }
  function mt(label, val, cls){ return '<div class="ms total"><span>'+label+'</span><b class="num '+(cls||'')+'">'+val+'</b></div>'; }
  function bk(o){ return (o.birds ? esc(birds(o.birds))+' · ' : '') + kg(o.kg); }
  function kpi(label, val, sub, cls, vcls){ return '<div class="kpi-card '+(cls||'')+'"><div class="kpi-label">'+esc(label)+'</div><div class="kpi-value num '+(vcls||'')+'">'+val+'</div><div class="kpi-sub">'+esc(sub||'')+'</div></div>'; }
  function lossBadge(o){
    if(!o.loadK) return '';
    if(!o.soldK) return '<span class="badge warn">Sale not entered</span>';
    return o.over ? '<span class="badge bad">Loss '+o.lossPct+'% — over '+allowPct()+'%</span>' : '<span class="badge good">Loss '+o.lossPct+'% OK</span>';
  }
  /* rows: arrays of cells, or { cls:'over', cells:[...] }. A cell can be { v, cls }. */
  function table(heads, rows, totals){
    var h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + heads.map(function(x){ return '<th>'+x+'</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function(r){
      var cells = Array.isArray(r) ? r : r.cells, attr = Array.isArray(r) ? '' : (r.attr||'');
      h += '<tr class="'+(Array.isArray(r)?'':(r.cls||''))+'" '+attr+'>' + cells.map(function(c){ return c && typeof c==='object' ? '<td class="'+(c.cls||'')+'">'+c.v+'</td>' : '<td>'+c+'</td>'; }).join('') + '</tr>';
    });
    if(totals) h += '<tr class="tot">' + totals.map(function(c){ return '<td>'+c+'</td>'; }).join('') + '</tr>';
    return h + '</tbody></table></div>';
  }
  function needJeeps(){ if(!db.jeeps.length){ toast('Add a jeep first (More → Jeeps setup)'); return true; } return false; }

  /* ================= HOME ================= */
  function renderToday(){
    var d = state.date, st = stockOn(d), rate = db.rates[d], fr = fridgeDay(d);
    var jd = db.jeeps.map(function(j){ return { j:j, o:jeepDay(j.id, d) }; });
    var bal = balances(d), drv = r2(sum(jd, function(x){ return x.o.close; }));
    var tSale = r2(sum(jd, function(x){ return x.o.amt; }) + fr.amt), tSoldK = r2(sum(jd, function(x){ return x.o.soldK; }));
    var gp = gpayPending(), gpAmt = r2(sum(gp,'amt'));
    var html = dateNav();
    if(!db.jeeps.length){
      html += '<div class="banner"><b>Welcome to '+esc(company())+'</b>Start in <b style="display:inline">More → Jeeps setup</b> to add your jeeps and drivers, then <b style="display:inline">More → Settings</b> for opening cash &amp; bank.</div>';
    }
    html += '<div class="hero"><div class="hero-top"><div><div class="hero-k">Daily rate</div><div class="hero-rate num">'+(rate ? money(rate)+' / kg' : 'Not set')+'</div></div>' +
      '<button class="hero-btn" id="setRate">'+(rate?'Change rate':'Set rate')+'</button></div><div class="hero-grid">' +
      '<div class="hero-stat"><div class="hero-k">Total sale</div><b class="num">'+money(tSale)+'</b><small>'+kg(tSoldK)+' live'+(fr.soldK?' + '+kg(fr.soldK)+' dressed':'')+'</small></div>' +
      '<div class="hero-stat"><div class="hero-k">Cash in hand</div><b class="num">'+money(bal.cash)+'</b><small>end of day</small></div>' +
      '<div class="hero-stat"><div class="hero-k">Bank</div><b class="num">'+money(bal.bank)+'</b><small>'+(gpAmt?money(gpAmt)+' GPay to check':'all GPay checked')+'</small></div>' +
      '<div class="hero-stat'+(drv>0.5?' hot':'')+'"><div class="hero-k">Udhar with drivers</div><b class="num">'+money(drv)+'</b><small>carried to tomorrow</small></div>' +
      '</div></div>';

    jd.forEach(function(x){
      if(x.o.over) html += '<div class="alert"><span><b>'+esc(x.j.name)+': weight loss '+x.o.lossPct+'%</b> — above the '+allowPct()+'% allowed. '+kg(x.o.extraK)+' extra lost ≈ '+money(x.o.extraVal)+'.</span><span class="al-go" data-goto="jeeps">Check</span></div>';
    });
    if(gpAmt) html += '<div class="alert info"><span><b>'+money(gpAmt)+' GPay not yet checked</b> in your bank account ('+gp.length+' payment'+(gp.length===1?'':'s')+').</span><span class="al-go" data-goto="cash">Tally</span></div>';

    html += '<div class="section-title">Quick entry</div><div class="actions">' +
      act('truck','truck','Truck in') + act('load','load','Load jeep') + act('sale','sale','Jeep sale','g') + act('money','cash','Money from driver','g') +
      act('dead','dead','Dead birds','r') + act('expense','expense','Expense','r') + act('deposit','bank','Bank deposit') + act('dressed','fridge','Sell dressed') + '</div>';

    var stock = '<div class="section-title">Farm stock <span class="st-sub">weight</span></div><div class="card">' +
      ms('Left at farm from before', bk(st.open)) + ms('+ Truck in', bk({birds:st.inB, kg:st.inK})) +
      (st.tdK ? ms('− Dead in truck <small>to dressing</small>', bk({birds:st.tdB, kg:st.tdK})) : '') +
      ms('− Loaded into jeeps', bk({birds:st.loadB, kg:st.loadK})) +
      (st.retK ? ms('+ Returned alive by jeeps', bk({birds:st.retB, kg:st.retK})) : '') +
      (st.fdK ? ms('− Died at farm', bk({birds:st.fdB, kg:st.fdK})) : '') +
      mt('Left at farm → tomorrow', bk(st.close)) + '</div>';

    var jt = '<div class="section-title">Jeeps today <button data-goto="jeeps">Open jeeps</button></div>';
    var act_ = jd.filter(function(x){ return x.o.active || Math.abs(x.o.open) > 0.004; });
    if(!act_.length) jt += emptyState('Nothing yet today', 'Load a jeep to start the day.');
    else jt += table(['Jeep','Loaded','Sold','Loss %','Sale ₹','Received ₹','Udhar ₹'],
      act_.map(function(x){ var o = x.o; return { cls:o.over?'over':'', cells:[esc(x.j.name), kgN(o.loadK), kgN(o.soldK), {v:o.loadK&&o.soldK?o.lossPct+'%':'—', cls:o.over?'bad':''}, money(o.amt), money(o.recv), {v:money(o.close), cls:o.close>0.5?'bad':''}] }; }),
      ['Total', kgN(sum(act_, function(x){ return x.o.loadK; })), kgN(sum(act_, function(x){ return x.o.soldK; })), pct(sum(act_, function(x){ return x.o.lossK; }), sum(act_, function(x){ return x.o.loadK; })), money(sum(act_, function(x){ return x.o.amt; })), money(sum(act_, function(x){ return x.o.recv; })), money(sum(act_, function(x){ return x.o.close; }))]);

    var fl = flows(onDate(d));
    var money_ = '<div class="section-title">Cash today <button data-goto="cash">Cash book</button></div><div class="card">' +
      ms('Cash from drivers', money(fl.jeepCash)) + ms('GPay from drivers <small>goes to bank</small>', money(fl.jeepGpay)) +
      (fl.dressCash || fl.dressGpay ? ms('Dressed chicken sale', money(fl.dressCash + fl.dressGpay)) : '') +
      ms('Paid out in cash <small>farm, truck expenses, other</small>', money(fl.farmCash + fl.truckExp + fl.expCash)) +
      ms('Deposited in bank', money(fl.dep)) + mt('Cash left in hand', money(bal.cash)) + '</div>';
    var fridge = '<div class="section-title">Fridge (dressed) <button data-goto="fridge">Open</button></div><div class="card">' +
      ms('Dressed today', kg(fr.inK)) + ms('Sold today', kg(fr.soldK)+' · '+money(fr.amt)) + mt('In fridge now', kg(fr.close)) + '</div>';

    html += '<div class="cols"><div>'+jt+money_+'</div><div>'+stock+fridge+'</div></div>';

    $view.innerHTML = html;
    wireNav();
    f($view,'setRate').onclick = function(){ openRateForm(d); };
    $view.querySelectorAll('[data-act]').forEach(function(b){ b.onclick = function(){ quickAction(b.getAttribute('data-act')); }; });
  }
  function quickAction(k){
    if(k==='truck') return openTruckForm();
    if(k==='load') return openLoadForm(null, null, 'load');
    if(k==='sale') return openSaleForm();
    if(k==='money') return openHandoverForm();
    if(k==='dead') return openDeadForm();
    if(k==='expense') return openExpenseForm();
    if(k==='deposit') return openTransferForm(null, 'c2b');
    if(k==='dressed') return openDressSaleForm();
    if(k==='count') return openStockForm(state.date);
  }

  /* ================= TRUCK ================= */
  function renderTruck(){
    var d = state.date, ym = d.slice(0,7), st = stockOn(d);
    var today = db.trucks.filter(onDate(d));
    var html = dateNav();
    var left = '<div class="section-title">Truck arrival <button id="addTruck">+ Truck</button></div>';
    if(!today.length) left += emptyState('No truck on '+dateShort(d), 'Tap + Truck when the truck arrives.');
    today.forEach(function(t){
      var ex = truckExps(t), td = truckDead(t), dK = td ? num(td.kg) : 0, dB = td ? num(td.birds) : 0;
      left += '<div class="card" style="margin-bottom:10px;"><div class="card-h"><h3>'+esc(t.farm||'Truck')+'</h3><button class="link" data-truck="'+t.id+'">Edit</button></div>' +
        ms('Weight on bill', bk(t)) + (dK ? ms('− Dead in truck <small>sent to dressing</small>', bk({birds:dB, kg:dK})) : '') +
        mt('Net live chicken received', bk({birds:num(t.birds)-dB, kg:num(t.kg)-dK})) +
        ms('Chicken cost <small>'+kg(t.kg)+' × '+money(t.rate)+'</small>', money(t.amount)) +
        ms('Paid to farm now <small>'+(t.payMode==='bank'?'bank':'cash')+'</small>', money(t.paid)) +
        '<div class="blk-t">Truck expenses (cash)</div>' +
        (ex.length ? ex.map(function(x){ return ms(esc(x.n), money(x.a)); }).join('') : ms('<span class="muted">No expenses added</span>', '—')) +
        mt('Total truck expenses', money(truckExpTotal(t))) +
        ms('Cost per kg with expenses', num(t.kg)-dK > 0 ? money((num(t.amount)+truckExpTotal(t))/(num(t.kg)-dK)) : '—') + '</div>';
    });
    left += '<div class="section-title">Farm stock <span class="st-sub">auto</span></div><div class="card">' +
      ms('Left at farm from before', bk(st.open)) + ms('+ Truck in', bk({birds:st.inB, kg:st.inK})) +
      ms('− Dead in truck', bk({birds:st.tdB, kg:st.tdK})) + mt('Available to load', bk({birds:st.availB, kg:st.availK})) +
      ms('− Loaded into jeeps', bk({birds:st.loadB, kg:st.loadK})) + ms('+ Returned alive', bk({birds:st.retB, kg:st.retK})) +
      ms('− Died at farm', bk({birds:st.fdB, kg:st.fdK})) + mt('Left at farm → tomorrow', bk(st.exp)) +
      (st.counted ? ms('Weighed at farm', bk(st.close)) + ms('Farm weight loss', '<span class="'+(st.lossK>0?'bad':'good')+'">'+kg(st.lossK)+'</span>') : '') +
      '<div class="ms"><span><small>Weighed the leftover yourself? Enter it to correct the figure.</small></span><button class="link" data-act="count">'+(st.counted?'Edit weight':'Weigh')+'</button></div></div>';

    var M = inMonth(ym), trucks = db.trucks.filter(M).sort(byDateDesc);
    var right = '<div class="section-title">Trucks — '+esc(monthLabel(ym))+'</div>';
    right += trucks.length ? table(['Date','Farm','Kg','Cost ₹','Expenses ₹','Paid ₹'],
      trucks.map(function(t){ return { attr:'data-truck="'+t.id+'" style="cursor:pointer"', cells:[esc(dateShort(t.date)), esc(t.farm||'—'), kgN(t.kg), money(t.amount), money(truckExpTotal(t)), {v:money(t.paid), cls:num(t.paid) < num(t.amount)-0.5 ? 'bad':''}] }; }),
      ['Total', trucks.length+' trucks', kgN(sum(trucks,'kg')), money(sum(trucks,'amount')), money(sum(trucks, truckExpTotal)), money(sum(trucks,'paid'))]) : emptyState('No trucks this month', '');
    var fbal = farmBalances();
    right += '<div class="section-title">Owed to farms <button id="payFarm">Pay farm</button></div>';
    if(!fbal.length) right += '<div class="card"><div class="ms"><span>Nothing pending</span><b>—</b></div></div>';
    else right += '<div class="card">' + fbal.map(function(x){
      return '<div class="ms"><span>'+esc(x.farm)+(x.due<0?' <small>advance paid</small>':'')+'</span><span style="display:flex;align-items:center;gap:8px;"><b class="num '+(x.due>0?'bad':'good')+'">'+money(Math.abs(x.due))+'</b>' +
        '<button class="link" data-payfarm="'+esc(x.farm)+'">Pay</button></span></div>';
    }).join('') + mt('Total owed', money(sum(fbal.filter(function(x){ return x.due > 0; }),'due')), 'bad') + '</div>';
    var pays = db.farmPays.filter(M).sort(byDateDesc);
    if(pays.length){
      right += '<div class="section-title">Farm payments — '+esc(monthLabel(ym))+'</div><div class="card">' + pays.map(function(p){
        return '<div class="sub-row" data-fpay="'+p.id+'"><span class="l">'+esc(dateShort(p.date))+' · '+esc(p.farm)+' <small>'+(p.mode==='bank'?'bank':'cash')+'</small></span><span class="r num">'+money(p.amount)+'</span></div>';
      }).join('') + '<div class="sub-row tot"><span class="l">Total paid</span><span class="r num">'+money(sum(pays,'amount'))+'</span></div></div>';
    }
    html += '<div class="cols"><div>'+left+'</div><div>'+right+'</div></div>';
    $view.innerHTML = html;

      '<div class="field"><label>Paid from</label>'+segmented('tMode', [['bank','Bank'],['cash','Cash']], t?t.payMode||'bank':'bank')+'</div></div>' +

      function draw(list){
        box.innerHTML = list.map(function(x, i){ return '<div class="exp-row"><input class="n" list="texpList" value="'+esc(x.n)+'" placeholder="Expense name"><input class="a" type="number" inputmode="decimal" value="'+(x.a||'')+'" placeholder="₹"><button type="button" data-rm="'+i+'" aria-label="Remove">×</button></div>'; }).join('');
        box.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick = function(){ var l = readExps(); l.splice(+b.getAttribute('data-rm'), 1); draw(l); }; });
        box.querySelectorAll('.a').forEach(function(i){ i.addEventListener('input', tot); });
        tot();
      }
      function tot(){ f(root,'tExpTot').textContent = money(sum(readExps(), 'a')); }
      draw(exps.length ? exps : [{ n:'', a:'' }]);
      root.querySelectorAll('[data-pre]').forEach(function(b){ b.onclick = function(){
        var l = readExps().filter(function(x){ return x.n || x.a; }); l.push({ n:b.getAttribute('data-pre'), a:'' }); draw(l);
        var ins = box.querySelectorAll('.a'); ins[ins.length-1].focus();
      }; });
      function calc(){ f(root,'tAmt').value = r2(num(f(root,'tKg').value) * num(f(root,'tRate').value)); }
      ['tKg','tRate'].forEach(function(i){ f(root,i).addEventListener('input', calc); });

        rec.date = f(root,'tDate').value || state.date; rec.farm = f(root,'tFarm').value.trim();
        rec.birds = Math.round(num(f(root,'tBirds').value)); rec.kg = kgV; rec.rate = num(f(root,'tRate').value);
        rec.amount = r2(rec.kg * rec.rate);
        rec.exps = readExps().filter(function(x){ return x.a > 0; }).map(function(x){ return { n:x.n || 'Expense', a:x.a }; });
        rec.expTotal = r2(sum(rec.exps, 'a'));
        delete rec.freight; delete rec.labour;
        rec.paid = Math.min(num(f(root,'tPaid').value), rec.amount); rec.payMode = mode();

          var dr = old || { id:'dt_'+rec.id, src:'truck' };

          dr.date = rec.date; dr.birds = dB; dr.kg = dK; dr.note = 'Dead in truck'+(rec.farm?' — '+rec.farm:'');

      f(root,'sJeep').addEventListener('change', hint); f(root,'sDate').addEventListener('change', hint);

        rec.birds = Math.round(num(f(root,'sBirds').value)); rec.kg = k; rec.amount = r2(a); rec.rate = r2(a / k);

    });

  function openWorkerPayForm(wid, kind, id){
    var e = id ? db.expenses.find(function(x){ return x.id===id; }) : null;

    kind = e ? (e.kind||'salary') : kind;

    var html = '<h2>'+(e?'Edit ':'')+(kind==='advance'?'Advance':'Salary')+' — '+esc(w.name)+'</h2>' +

  /* ================= EXPENSES ================= */
  function renderExpenses(){
    var ym = state.date.slice(0,7), M = inMonth(ym);

    var truckTot = r2(sum(trucks, truckExpTotal));
    var house = sum(ex.filter(function(e){ return e.cat==='house'; }),'amount');

    var html = monthNav();
    html += '<div class="kpi-grid" style="margin-bottom:6px;">' + kpi('All expenses', money(sum(ex,'amount') + truckTot), monthLabel(ym), 'red') +
      kpi('Truck expenses', money(truckTot), trucks.length+' truck'+(trucks.length===1?'':'s'), 'blue') +
      kpi('Staff paid', money(staffAmt), 'salary + advances', 'amber') + kpi('House', money(house), 'kept separate', 'green') + '</div>';
    var cats = EXP_CATS.map(function(c){ return [c[1], sum(ex.filter(function(e){ return e.cat===c[0]; }),'amount')]; }).filter(function(c){ return c[1]; });

      (cats.length ? cats.map(function(c){ return ms(esc(c[0]), money(c[1])); }).join('') : ms('<span class="muted">No other expenses</span>', '—')) +
      mt('Total (without truck)', money(sum(ex,'amount'))) + '</div>' +
      '<div class="section-title">Truck expenses</div><div class="card">' +
      (Object.keys(tNames).length ? Object.keys(tNames).map(function(n){ return ms(esc(n), money(tNames[n])); }).join('') : ms('<span class="muted">None</span>', '—')) +
      mt('Total truck expenses', money(truckTot)) + '</div>' +
      '<div class="card" style="margin-top:10px;">' + mt('Grand total', money(sum(ex,'amount') + truckTot)) + '</div>';
    var main = '<div class="section-title">Entries — '+esc(monthLabel(ym))+' <button id="addE">+ Expense</button></div>';
    if(!ex.length) main += emptyState('No expenses this month', 'Tap + Expense for diesel, repairs, house… Truck expenses are entered with the truck.');
    else {
      var byDay = {}; ex.forEach(function(e){ (byDay[e.date] = byDay[e.date] || []).push(e); });
      Object.keys(byDay).sort().reverse().forEach(function(dt){

            '<div class="row-sub">'+esc([w?catLabel(e.cat):'', j?j.name:'', e.note||''].filter(Boolean).join(' · ')||'—')+'</div></div>' +
            '<div class="row-end"><div class="row-amt num">'+money(e.amount)+'</div><span class="badge plain">'+(e.mode==='bank'?'Bank':e.mode==='driver'?'Driver cash':'Cash')+'</span></div></div>';
        });
        main += '</div>';
      });
      main += '<div class="card" style="margin-top:12px;">' + mt('Month total ('+ex.length+' entries)', money(sum(ex,'amount'))) + '</div>';
    }
    html += '<div class="cols"><div>'+main+'</div><div>'+side+'</div></div>';
    $view.innerHTML = html;
    wireNav();

      if(e) f(root,'eDel').onclick = function(){ removeRec('expenses', e.id, 'expense'); };
