  /* ================= EXCEL =================
     Uses a bundled copy of xlsx-js-style (SheetJS with cell colours), so it
     works offline and can colour over-limit losses red. The file is offered
     through the phone's share sheet (WhatsApp, Drive…) or saved directly. */
  var XLSX_URL = 'xlsx.min.js';
  function loadXLSX(){
    if(window.XLSX && window.XLSX.style_version) return Promise.resolve(window.XLSX);
    return new Promise(function(res, rej){
      var sc = document.createElement('script'); sc.src = XLSX_URL;
      sc.onload = function(){ window.XLSX ? res(window.XLSX) : rej(new Error('Excel library missing')); }; sc.onerror = rej;
      document.head.appendChild(sc);
    });
  }
  function openExcelForm(){
    var ym = state.date.slice(0,7);
    var html = '<h2>Excel Export</h2>' +
      '<p class="hint" style="margin:-6px 0 14px;font-size:12.5px;">One Excel file with a sheet for each part: summary, daily, jeeps (losses above '+allowPct()+'% in red), trucks, farm stock, dead &amp; fridge, cash book, GPay tally, deposits, expenses and salary — every sheet has totals.</p>' +
      '<div class="field"><label>Month</label><input type="month" id="xlMonth" value="'+ym+'"></div>' +
      '<button class="btn btn-primary" id="xlGo">Make Excel file</button>';
    openSheet(html, function(root){
      f(root,'xlGo').onclick = function(){
        var btn = this, m = f(root,'xlMonth').value || ym;
        btn.disabled = true; btn.textContent = 'Preparing…';
        loadXLSX().then(function(X){
          var out = buildExcel(X, m);
          deliverFile(out.blob, out.name);
        }).catch(function(err){
          btn.disabled = false; btn.textContent = 'Make Excel file';
          toast('Could not make the Excel file'+(err && err.message ? ': '+err.message : ''));
        });
      };
    });
  }
  function deliverFile(blob, name){
    var file = null;
    try{ file = new File([blob], name, { type:blob.type }); }catch(e){}
    var canShare = !!(file && navigator.canShare && navigator.canShare({ files:[file] }));
    function download(){
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
      toast('Excel file saved — check Downloads');
    }
    openSheet('<h2>Excel file ready</h2><div class="calc-line"><span>'+esc(name)+'</span><b class="num">'+Math.max(1, Math.round(blob.size/1024))+' KB</b></div>' +
      (canShare ? '<button class="btn btn-primary" id="flShare" style="margin-bottom:10px;">Share / open (WhatsApp, Drive, Excel…)</button>' : '') +
      '<button class="btn '+(canShare?'btn-ghost':'btn-primary')+'" id="flSave">Save to this device</button>' +
      '<p class="hint" style="margin-top:12px;">On a phone, “Share” is the easiest — send it to yourself on WhatsApp or open it in Excel / Google Sheets.</p>',
      function(root){
        if(canShare) f(root,'flShare').onclick = function(){
          navigator.share({ files:[file], title:name }).then(function(){ closeSheet(); }).catch(function(err){ if(!err || err.name!=='AbortError') download(); });
        };
        f(root,'flSave').onclick = function(){ download(); closeSheet(); };
      });
  }
  function buildExcel(X, ym){
    var wb = X.utils.book_new(), co = company(), mLab = monthLabel(ym), M = inMonth(ym);
    var BORDER = { top:{style:'thin',color:{rgb:'D5DCE6'}}, bottom:{style:'thin',color:{rgb:'D5DCE6'}}, left:{style:'thin',color:{rgb:'D5DCE6'}}, right:{style:'thin',color:{rgb:'D5DCE6'}} };
    var ST = {
      title: { font:{ bold:true, sz:14, color:{rgb:'D6202F'} } },
      sub: { font:{ italic:true, color:{rgb:'64748B'} } },
      head: { font:{ bold:true, color:{rgb:'FFFFFF'} }, fill:{ patternType:'solid', fgColor:{rgb:'0B1F3A'} }, alignment:{ horizontal:'center', vertical:'center', wrapText:true }, border:BORDER },
      cell: { border:BORDER },
      over: { fill:{ patternType:'solid', fgColor:{rgb:'FDE2E2'} }, font:{ color:{rgb:'B91C1C'} }, border:BORDER },
      overB: { fill:{ patternType:'solid', fgColor:{rgb:'FCA5A5'} }, font:{ bold:true, color:{rgb:'7F1D1D'} }, border:BORDER },
      ok: { fill:{ patternType:'solid', fgColor:{rgb:'E6F5EB'} }, font:{ color:{rgb:'166534'} }, border:BORDER },
      tot: { font:{ bold:true }, fill:{ patternType:'solid', fgColor:{rgb:'E2E8F0'} }, border:{ top:{style:'medium',color:{rgb:'0F172A'}}, bottom:{style:'thin',color:{rgb:'D5DCE6'}}, left:BORDER.left, right:BORDER.right } }
    };
    /* rows: arrays, or { cells:[...], st:'over'|'ok'|'tot', hot:[colIdx…] } — hot cells get the strong red. */
    function add(name, head, rows, widths, note){
      var aoa = [[co+' — '+name+' — '+mLab], [note || ('Made on '+dateLabel(todayISO()))], []];
      aoa.push(head);
      rows.forEach(function(r){ aoa.push(Array.isArray(r) ? r : r.cells); });
      var ws = X.utils.aoa_to_sheet(aoa);
      function setS(ri, ci, s){
        var ref = X.utils.encode_cell({ r:ri, c:ci });
        if(!ws[ref]) ws[ref] = { t:'s', v:'' };
        ws[ref].s = s;
        if(ws[ref].t==='n') ws[ref].z = Number.isInteger(ws[ref].v) ? '#,##0' : '#,##0.00';
      }
      setS(0, 0, ST.title); setS(1, 0, ST.sub);
      head.forEach(function(_, ci){ setS(3, ci, ST.head); });
      rows.forEach(function(r, i){
        var st = Array.isArray(r) ? 'cell' : (r.st || 'cell'), hot = Array.isArray(r) ? [] : (r.hot || []);
        head.forEach(function(_, ci){ setS(4 + i, ci, hot.indexOf(ci) >= 0 ? ST.overB : ST[st]); });
      });
      ws['!cols'] = (widths || head.map(function(){ return 14; })).map(function(w){ return { wch:w }; });
      ws['!rows'] = [{ hpt:22 }, {}, {}, { hpt:32 }];
      X.utils.book_append_sheet(wb, ws, name.slice(0,31));
    }
    function tot(cells){ return { cells:cells, st:'tot' }; }
    function jn(id){ var j = jeepById(id); return j ? j.name : ''; }
    function jd(id){ var j = jeepById(id); return j ? (j.driver||'') : ''; }
    var r = monthReport(ym), A = allowPct();

    /* 1. Summary */
    var p = [['Live chicken sales', r.sellAmt, r2(r.sellK)+' kg'], ['Dressed chicken sales', r.dressAmt, r2(r.dressK)+' kg'], ['Chicken bought', -r.buyAmt, r2(r.buyK)+' kg · '+r.trucks+' trucks'],
      ['Stock change at farm', r.stockChange, r2(r.openStock.kg)+' → '+r2(r.closeStock.kg)+' kg'], tot(['Margin on chicken', r.gross, '']), ['Truck expenses', -r.truckExp, '']];
    r.cats.filter(function(c){ return c.key!=='house'; }).forEach(function(c){ p.push([c.label, -c.amt, '']); });
    p.push(tot(['Business profit', r.profit, '']), ['House expenses', -r.house, ''], tot(['Left after house', r.net, '']), [],
      ['Loaded into jeeps (kg)', r.loadK, ''], ['Returned alive (kg)', r.retK, ''], ['Dead — all sources (kg)', r.deadK, r.deadB+' birds'], ['Sold by jeeps (kg)', r.sellK, ''],
      ['Allowed jeep loss (kg)', r.allowK, A+'% of loaded'],
      { cells:['Actual jeep loss (kg)', r.jeepLossK, r.jeepLossPct+'%'+(r.over?' — ABOVE '+A+'%':' — within limit')], st:r.over?'over':'ok' });
    add('Summary', ['Item','Amount','Detail'], p, [30,16,34]);

    /* 2. Daily */
    var dr = dailyRows(ym);
    add('Daily', ['Date','Truck in kg','Loaded kg','Sold kg','Loss kg','Loss %','Allowed %','Dead kg','Left at farm kg','Sales ₹','Received ₹','Expenses ₹'],
      dr.map(function(x){ return { cells:[x.date, x.inK, x.loadK, x.soldK, x.lossK, x.loadK?x.lossPct:'', A, x.deadK, x.left, x.sales, x.recv, x.exp], st:x.over?'over':'cell', hot:x.over?[4,5]:[] }; })
        .concat([tot(['Total', r2(sum(dr,'inK')), r2(sum(dr,'loadK')), r2(sum(dr,'soldK')), r2(sum(dr,'lossK')), pctOf(sum(dr,'lossK'), sum(dr,'loadK')), A, r2(sum(dr,'deadK')), '', r2(sum(dr,'sales')), r2(sum(dr,'recv')), r2(sum(dr,'exp'))])]),
      [12,11,11,11,10,9,10,10,14,12,12,12], 'Red rows = a jeep lost more than '+A+'% of what it loaded that day.');

    /* 3. Jeep days — every jeep, every day */
    var jrows = [], jt = { loadK:0, retK:0, deadK:0, allowK:0, idealK:0, soldK:0, lossK:0, extraK:0, amt:0, cashIn:0, gpayIn:0, exp:0 };
    activeDates(ym).forEach(function(d){
      db.jeeps.forEach(function(j){
        var o = jeepDay(j.id, d); if(!o.active) return;
        for(var k in jt) jt[k] += o[k];
        jrows.push({ cells:[d, j.name, j.driver||'', o.loadK, o.retK, o.deadK, o.allowK, o.idealK, o.soldK, o.lossK, o.loadK?o.lossPct:'', o.over?o.extraK:0, o.over?o.extraVal:0, o.over?'OVER LIMIT':(o.soldK?'OK':''), o.amt, o.cashIn, o.gpayIn, o.exp, o.open, o.close],
          st:o.over?'over':'cell', hot:o.over?[9,10,11,12,13]:[] });
      });
    });
    for(var k in jt) jt[k] = r2(jt[k]);
    jrows.push(tot(['Total','','', jt.loadK, jt.retK, jt.deadK, jt.allowK, jt.idealK, jt.soldK, jt.lossK, pctOf(jt.lossK, jt.loadK), '', '', '', jt.amt, jt.cashIn, jt.gpayIn, jt.exp, '', '']));
    add('Jeep days', ['Date','Jeep','Driver','Loaded kg','Returned kg','Dead kg','Allowed loss kg ('+A+'%)','Should sell kg','Sold kg','Loss kg','Loss %','Extra loss kg','Extra loss ₹','Check','Sale ₹','Cash ₹','GPay ₹','Driver spent ₹','Old udhar ₹','Udhar carried ₹'],
      jrows, [11,12,12,10,10,9,12,11,10,9,8,10,11,12,11,11,10,10,11,12]);

    /* 4. Jeeps month */
    var jr = jeepRows(ym);
    add('Jeeps month', ['Jeep','Driver','Loaded kg','Returned kg','Dead kg','Sold kg','Loss kg','Loss %','Days over limit','Sale ₹','Cash ₹','GPay ₹','Spent ₹','Udhar now ₹'],
      jr.map(function(x){ return { cells:[x.j.name, x.j.driver||'', x.loadK, x.retK, x.deadK, x.soldK, x.lossK, x.loadK?x.lossPct:'', x.overDays, x.amt, x.cashIn, x.gpayIn, x.exp, x.bal], st:x.over?'over':'cell', hot:x.over?[6,7]:[] }; })
        .concat([tot(['Total','', r2(sum(jr,'loadK')), r2(sum(jr,'retK')), r2(sum(jr,'deadK')), r2(sum(jr,'soldK')), r2(sum(jr,'lossK')), pctOf(sum(jr,'lossK'), sum(jr,'loadK')), sum(jr,'overDays'), r2(sum(jr,'amt')), r2(sum(jr,'cashIn')), r2(sum(jr,'gpayIn')), r2(sum(jr,'exp')), r2(sum(jr,'bal'))])]),
      [14,14,11,11,9,10,9,8,10,12,12,11,10,12]);

    /* 5. Trucks with expenses */
    var trs = db.trucks.filter(M).sort(byDateAsc), trows = [];
    trs.forEach(function(t){
      var td = truckDead(t), ex = truckExps(t);
      trows.push([t.date, t.farm||'', num(t.birds)||'', num(t.kg), td?num(td.kg):0, r2(num(t.kg) - (td?num(td.kg):0)), num(t.rate), num(t.amount), truckExpTotal(t), ex.map(function(x){ return x.n+': '+x.a; }).join(', '), num(t.paid), t.payMode==='bank'?'Bank':'Cash', t.note||'']);
    });
    trows.push(tot(['Total', trs.length+' trucks', sum(trs,'birds'), r2(sum(trs,'kg')), r2(sum(trs, function(t){ var td = truckDead(t); return td ? num(td.kg) : 0; })), r2(sum(trs,'kg') - sum(trs, function(t){ var td = truckDead(t); return td ? num(td.kg) : 0; })), '', r2(sum(trs,'amount')), r2(sum(trs, truckExpTotal)), '', r2(sum(trs,'paid')), '', '']));
    add('Trucks', ['Date','Farm','Birds','Kg on bill','Dead in truck kg','Net kg','Rate','Chicken cost ₹','Truck expenses ₹','Expense details','Paid now ₹','Paid from','Note'], trows, [11,16,8,10,10,10,8,13,12,40,11,9,16]);

    /* 6. Farm stock flow */
    var sd = monthDates(ym).filter(function(d){ var s = stockOn(d); return s.inK || s.loadK || s.retK || s.tdK || s.fdK || s.counted; });
    add('Farm stock', ['Date','Left from before kg','Truck in kg','Dead in truck kg','Loaded to jeeps kg','Returned alive kg','Died at farm kg','Left at farm kg'],
      sd.map(function(d){ var s = stockOn(d); return [d, s.open.kg, s.inK, s.tdK, s.loadK, s.retK, s.fdK, s.close.kg]; })
        .concat([tot(['Total','', r2(sum(sd, function(d){ return stockOn(d).inK; })), r2(sum(sd, function(d){ return stockOn(d).tdK; })), r2(sum(sd, function(d){ return stockOn(d).loadK; })), r2(sum(sd, function(d){ return stockOn(d).retK; })), r2(sum(sd, function(d){ return stockOn(d).fdK; })), ''])]),
      [11,14,11,13,14,14,12,13]);

    /* 7. Dead & dressing, 8. dressed sales */
    var dd = db.dead.filter(M).sort(byDateAsc);
    add('Dead & dressing', ['Date','From','Birds','Dead kg','Dressed kg','Note'],
      dd.map(function(x){ return [x.date, srcLabel(deadSrc(x)), num(x.birds)||'', num(x.kg), dressedKg(x), x.note||'']; })
        .concat([tot(['Total','', sum(dd,'birds'), r2(sum(dd,'kg')), r2(sum(dd, dressedKg)), ''])]), [11,24,8,10,11,24]);
    var ds = dressSalesAll().filter(M).sort(byDateAsc);
    add('Dressed sales', ['Date','Shop','Kg','Rate','Amount ₹','Paid by','GPay seen in bank'],
      ds.map(function(s){ return [s.date, s.shop||'', num(s.kg), num(s.rate), num(s.amount), s.mode==='gpay'?'GPay':'Cash', s.mode==='gpay'?(s.gpayOk?'Yes':'NOT YET'):'']; })
        .concat([tot(['Total','', r2(sum(ds,'kg')), '', r2(sum(ds,'amount')), '', ''])]), [11,20,9,8,12,9,16]);

    /* 9. Cash book */
    var cb = monthDates(ym).map(function(d){
      var o = balances(addDays(d, -1)), c = balances(d), fl = flows(onDate(d));
      return { d:d, fl:fl, open:o.cash, close:c.cash, bank:c.bank };
    }).filter(function(x){ return x.fl.cashIn || x.fl.cashOut || x.fl.bankIn || x.fl.bankOut; });
    add('Cash book', ['Date','Opening cash','Cash from drivers','Dressed cash','Other cash in','Withdrawn','Paid farms (cash)','Truck expenses','Expenses & salary (cash)','Deposited to bank','Cash left','GPay received','Bank balance'],
      cb.map(function(x){ var fl = x.fl; return [x.d, x.open, fl.jeepCash, fl.dressCash, fl.otherCash, fl.wd, fl.farmCash, fl.truckExp, fl.expCash, fl.dep, x.close, r2(fl.jeepGpay + fl.dressGpay), x.bank]; })
        .concat([tot(['Total','', r2(sum(cb, function(x){ return x.fl.jeepCash; })), r2(sum(cb, function(x){ return x.fl.dressCash; })), r2(sum(cb, function(x){ return x.fl.otherCash; })), r2(sum(cb, function(x){ return x.fl.wd; })), r2(sum(cb, function(x){ return x.fl.farmCash; })), r2(sum(cb, function(x){ return x.fl.truckExp; })), r2(sum(cb, function(x){ return x.fl.expCash; })), r2(sum(cb, function(x){ return x.fl.dep; })), cb.length ? cb[cb.length-1].close : '', r2(sum(cb, function(x){ return x.fl.jeepGpay + x.fl.dressGpay; })), cb.length ? cb[cb.length-1].bank : ''])]),
      [11,12,12,11,11,10,12,11,14,12,11,11,12]);

    /* 10. GPay tally */
    var gp = gpayItems(M).sort(byDateAsc);
    add('GPay tally', ['Date','From','Type','Amount ₹','Seen in bank'],
      gp.map(function(g){ return { cells:[g.date, g.label, g.sub, g.amt, g.rec.gpayOk?'Yes':'NOT YET'], st:g.rec.gpayOk?'ok':'over' }; })
        .concat([tot(['Total','','', r2(sum(gp,'amt')), '']), tot(['Seen in bank','','', r2(sum(gp.filter(function(g){ return g.rec.gpayOk; }),'amt')), '']), tot(['Not seen yet','','', r2(sum(gp.filter(function(g){ return !g.rec.gpayOk; }),'amt')), ''])]),
      [11,22,18,12,14], 'Red = GPay not yet found in the bank account.');

    /* 11. Deposits */
    var tr = db.transfers.filter(M).sort(byDateAsc);
    add('Bank deposits', ['Date','Type','Amount ₹','Note'],
      tr.map(function(t){ return [t.date, t.dir==='c2b'?'Cash deposited to bank':'Cash withdrawn from bank', num(t.amount), t.note||'']; })
        .concat([tot(['Total deposited','', r2(sum(tr.filter(function(t){ return t.dir==='c2b'; }),'amount')), '']), tot(['Total withdrawn','', r2(sum(tr.filter(function(t){ return t.dir!=='c2b'; }),'amount')), ''])]), [11,26,12,22]);

    /* 12. Expenses (incl. truck) */
    var ex = db.expenses.filter(M).sort(byDateAsc), erows = [];
    ex.forEach(function(e){ var w = workerById(e.workerId); erows.push([e.date, w ? w.name+' — '+(e.kind==='advance'?'advance':'salary') : catLabel(e.cat), num(e.amount), e.mode==='bank'?'Bank':e.mode==='driver'?'Driver cash':'Cash', jn(e.jeepId), e.note||'']); });
    trs.forEach(function(t){ truckExps(t).forEach(function(x){ erows.push([t.date, 'Truck — '+x.n, num(x.a), 'Cash', '', t.farm||'']); }); });
    erows.sort(function(a,b){ return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
    erows.push(tot(['Total','', r2(sum(ex,'amount') + sum(trs, truckExpTotal)), '', '', '']));
    add('Expenses', ['Date','Type','Amount ₹','Paid from','Jeep','Note'], erows, [11,30,12,12,12,24]);

    /* 13. Salary */
    var sr = salaryRows(ym);
    add('Salary', ['Worker','Role','Salary','Earned this month ₹','Salary paid ₹','Advance ₹','Paid till now ₹','To pay now ₹ (− = advance)'],
      sr.map(function(x){ return [x.w.name, roleLabel(x.w.role), x.w.payType==='daily'?num(x.w.wage)+'/day':num(x.w.salary), x.m.earned, x.m.paidSalary, x.m.paidAdvance, x.all, x.bal]; })
        .concat([tot(['Total','', '', r2(sum(sr, function(x){ return x.m.earned; })), r2(sum(sr, function(x){ return x.m.paidSalary; })), r2(sum(sr, function(x){ return x.m.paidAdvance; })), r2(sum(sr,'all')), r2(sum(sr,'bal'))])]),
      [18,12,12,15,13,11,14,20]);

    var data = X.write(wb, { bookType:'xlsx', type:'array' });
    return { blob: new Blob([data], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name: co.replace(/[^a-z0-9]+/gi,'-') + '-' + ym + '.xlsx' };
  }

  /* ================= backup ================= */
  function exportData(){
    var blob = new Blob([JSON.stringify(db, null, 1)], { type:'application/json' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'aryan-traders-backup-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    try{ localStorage.setItem(BACKUP_KEY, todayISO()); }catch(e){}
    toast('Backup downloaded'); render();
  }
  function importData(ev){
    var file = ev.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ toast('Not a valid backup file'); return; }
      if(!parsed || !Array.isArray(parsed.sales)){ toast('Not an Aryan Traders backup'); return; }
      confirmThen('Restore backup?', 'All current data'+(authUser?' in your account':' on this device')+' will be replaced with the backup.', 'Restore', function(){
        db = normalize(parsed); save(); cloudReplaceAll(db); toast('Backup restored'); render();
      });
    };
    reader.readAsText(file);
    ev.target.value = '';
  }

  /* ================= render dispatch ================= */
  var FAB = {
    truck: function(){ openTruckForm(); },
    jeeps: function(){ openSaleForm(); },
    fridge: function(){ openDeadForm(); },
    cash: function(){ openTransferForm(null, 'c2b'); },
    staff: function(){ openWorkerForm(); },
    expenses: function(){ openExpenseForm(); }
  };
  var TITLES = { today:'Home', truck:'Truck & Farm Stock', jeeps:'Jeep Accounts', fridge:'Fridge — Dressed Chicken', cash:'Cash & Bank', staff:'Staff Salary', expenses:'Expenses', more:'More' };
  var SUB_TITLES = { reports:'Reports', jeeplist:'Jeeps Setup', data:'Backup' };
  $fab.addEventListener('click', function(){ if(FAB[state.tab]) FAB[state.tab](); });
  function switchTab(t){
    state.tab = t; state.sub = null;
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-tab')===t); });
    window.scrollTo(0,0); render();
  }
  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ switchTab(t.getAttribute('data-tab')); }); });
  function render(){
    var title = state.tab==='more' && state.sub ? SUB_TITLES[state.sub] : TITLES[state.tab];
    $title.textContent = title; $sub.textContent = title;
    document.querySelectorAll('.logo-name').forEach(function(el){ el.textContent = company().toUpperCase(); });
    document.title = company();
    $dateLabel.textContent = state.date===todayISO() ? 'Today' : chipLabel(state.date);
    $datePick.value = state.date;
    var dot = document.getElementById('syncDot');
    dot.classList.toggle('on', !!authUser);
    dot.title = authUser ? 'Synced to '+authUser.email : 'Not signed in — data only on this device';
    $fab.classList.toggle('hidden', !FAB[state.tab]);
    ({ today:renderToday, truck:renderTruck, jeeps:renderJeeps, fridge:renderFridge, cash:renderCash, staff:renderStaff, expenses:renderExpenses, more:renderMore })[state.tab]();
  }
  render();
  restoreSession();

  if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
